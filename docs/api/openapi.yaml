                $ref: '#/components/schemas/AcceptInvitationResponse'
        '400':
          description: '`validation_failed` (empty token).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Token not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '409':
