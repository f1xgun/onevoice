  # =====================================================================
  # Orchestrator service (port 8090, no /api/v1 prefix)
  # Each operation overrides `servers:` to the cluster-internal base URL.
  # =====================================================================

  /chat/{conversationID}:
    post:
      operationId: orchestratorChat
      summary: Stream an LLM chat turn as Server-Sent Events.
      tags: [chat]
      servers:
        - url: http://orchestrator:8090
          description: Cluster-internal orchestrator base URL.
      parameters:
        - name: conversationID
          in: path
          required: true
          schema: { type: string }
        - name: X-Correlation-ID
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream of orchestrator events.
          headers:
            Cache-Control:
              schema: { type: string, example: no-cache }
            Connection:
              schema: { type: string, example: keep-alive }
            X-Accel-Buffering:
              schema: { type: string, example: 'no' }
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-events:
                text:                   { $ref: '#/components/schemas/SSEEventText' }
                tool_call:              { $ref: '#/components/schemas/SSEEventToolCall' }
                tool_result:            { $ref: '#/components/schemas/SSEEventToolResult' }
                tool_rejected:          { $ref: '#/components/schemas/SSEEventToolRejected' }
                tool_approval_required: { $ref: '#/components/schemas/SSEEventApprovalRequired' }
                done:                   { $ref: '#/components/schemas/SSEEventDone' }
                error:                  { $ref: '#/components/schemas/SSEEventError' }
        '400':
          description: Malformed body or streaming unsupported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Streaming infrastructure failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /chat/{conversationID}/resume:
    post:
      operationId: orchestratorResume
      summary: Resume a HITL-paused chat turn after approval/edit/reject.
      tags: [chat, hitl-resume]
      servers:
        - url: http://orchestrator:8090
      parameters:
        - name: conversationID
          in: path
          required: true
          schema: { type: string }
        - name: batch_id
          in: query
          required: true
          schema: { type: string }
        - name: X-Correlation-ID
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResumeRequest' }
      responses:
        '200':
          description: SSE stream — same wire shape as POST /chat/{conversationID}.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-events:
                text:                   { $ref: '#/components/schemas/SSEEventText' }
                tool_call:              { $ref: '#/components/schemas/SSEEventToolCall' }
                tool_result:            { $ref: '#/components/schemas/SSEEventToolResult' }
                tool_rejected:          { $ref: '#/components/schemas/SSEEventToolRejected' }
                tool_approval_required: { $ref: '#/components/schemas/SSEEventApprovalRequired' }
                done:                   { $ref: '#/components/schemas/SSEEventDone' }
                error:                  { $ref: '#/components/schemas/SSEEventError' }
        '400':
          description: '`batch_id` query param missing or streaming unsupported.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Streaming infrastructure failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /internal/draft-reply:
    post:
      operationId: orchestratorDraftReply
      summary: Generate an LLM draft reply for a customer review.
      tags: [internal]
      servers:
        - url: http://orchestrator:8090
      security:
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftReplyRequest' }
      responses:
        '200':
          description: Draft generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftReplyResponse' }
        '400':
          description: Invalid body or empty reviewText.
          content:
            text/plain:
              schema: { type: string }
        '405':
          description: Method other than POST.
          content:
            text/plain:
              schema: { type: string }
        '429':
          description: LLM rate limit exceeded.
          content:
            text/plain:
              schema: { type: string }
        '502':
          description: LLM upstream failure.
          content:
            text/plain:
              schema: { type: string }

  /internal/tools:
    get:
      operationId: orchestratorListTools
      summary: Full registry projection (locale-resolved descriptions).
      tags: [internal]
      servers:
        - url: http://orchestrator:8090
      security:
        - mtls: []
      responses:
        '200':
          description: Registry snapshot.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ToolRegistryEntry' }

  /internal/tools/names:
    get:
      operationId: orchestratorListToolNames
      summary: Tool-names projection for hitlvalidation.
      tags: [internal]
      servers:
        - url: http://orchestrator:8090
      security:
        - mtls: []
      responses:
        '200':
          description: List of registered tool names.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolNamesResponse' }

  # =====================================================================
  # Internal (api side) — mTLS — /internal/v1/...
  # =====================================================================

  /tokens:
    get:
      operationId: internalGetToken
      summary: Resolve decrypted integration tokens for a business + platform.
      tags: [internal]
      security:
        - mtls: []
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: platform
          in: query
          required: true
          schema:
            type: string
        - name: external_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Decrypted token payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTokenResponse'
        '400':
          description: Missing or invalid query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No active integration matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Token expired and the refresh attempt also failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /billing/usage_logs:
    post:
      operationId: internalLogUsage
      summary: Persist an LLM usage log row.
      tags: [internal]
      security:
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsageLog'
      responses:
        '204':
          description: Usage logged.
        '400':
          description: '`invalid_payload`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
        '405':
          description: Wrong HTTP verb.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
        '500':
          description: '`transient` — repository failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'

  /billing/daily_spend:
    get:
      operationId: internalGetDailySpend
      summary: Read a business's USD spend for a UTC calendar day.
      tags: [internal]
      security:
        - mtls: []
      parameters:
        - name: business_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Daily spend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySpendResponse'
        '400':
          description: Missing/invalid business_id or date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
        '405':
          description: Wrong HTTP verb.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'
        '500':
          description: '`transient` — repository failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingErrorResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Access-token cookie set by /auth/login. The orchestrator delegates
        cookie validation to services/api's chat_proxy facade, so this
        scheme also documents the public contract for orchestrator
        endpoints reached through that proxy.
    mtls:
      type: mutualTLS
      description: |
        Cluster-only mutual TLS. The public reverse proxy MUST drop any
        request matching an mTLS-protected prefix (/internal/*, /tokens,
        /billing/*) — application-level checks supplement the network
        boundary but do not replace it.

  parameters:
    BusinessIDPath:
      name: id
      in: path
      required: true
      description: Business UUID. Non-members receive 404 (not 403).
      schema:
        type: string
        format: uuid
    IntegrationIDPath:
      name: integrationId
      in: path
      required: true
      description: Integration UUID.
      schema:
        type: string
        format: uuid
    UserIDPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleIDPath:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationTokenPath:
      name: token
      in: path
      required: true
      description: Raw single-use invitation token. Server hashes before lookup.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessNotFound:
      description: Business not found or caller is not a member (masked).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal failure (`internal_server_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodeErrorResponse'

  schemas:
    # ===================================================================
    # Shared error envelopes (canonical, defined once)
    # ===================================================================

    ErrorResponse:
      description: Plain-text error envelope; emitted by writeJSONError.
      type: object
      required: [error]
      properties:
        error:
          type: string

    CodeErrorResponse:
      description: |
        Machine-routable error envelope; emitted by writeJSONCodeError.
        Frontend resolves `code` to a localized message via i18n catalog.
      type: object
      required: [code]
      properties:
        code:
          type: string

    BillingErrorResponse:
      description: |
        Error envelope used by the internal billing endpoints. `error`
        values map to pkg/billingclient sentinels.
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string

    # ===================================================================
    # Auth
    # ===================================================================

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string

    RefreshTokenResponse:
      type: object
      required: [user, accessToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string

    MeResponse:
      description: |
        Flattened user payload plus verification banner, deletion grace,
        and reconsent fields.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [emailVerified]
          properties:
            emailVerified:
              type: boolean
            emailVerificationDeadline:
              type: string
              format: date-time
              nullable: true
            accountDeletion:
              $ref: '#/components/schemas/AccountDeletionInfo'
            requiresReconsent:
              $ref: '#/components/schemas/RequiresReconsentInfo'

    AccountDeletionInfo:
      type: object
      nullable: true
      required: [requestedAt, scheduledDeletionAt, canRestoreUntil]
      properties:
        requestedAt:
          type: string
          format: date-time
        scheduledDeletionAt:
          type: string
          format: date-time
        canRestoreUntil:
          type: string
          format: date-time

    RequiresReconsentInfo:
      type: object
      nullable: true
      required: [policies]
      properties:
        policies:
          type: array
          items:
            type: object
            required: [slug, currentVersion]
            properties:
              slug:
                type: string
              currentVersion:
                type: string
              acceptedVersion:
                type: string
                nullable: true

    User:
      type: object
      required: [id, email, preferred_locale, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        preferred_locale:
          type: string
          enum: [ru, en]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, consents]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        consents:
          $ref: '#/components/schemas/RegisterConsents'

    RegisterConsents:
      type: object
      required: [tos, privacy, pdn]
      properties:
        tos:
          type: string
        privacy:
          type: string
        pdn:
          type: string

    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ConfirmPasswordResetRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8

    VerifyConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20

    EmailBeforeVerifyRequest:
      type: object
      required: [newEmail]
      properties:
        newEmail:
          type: string
          format: email

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UpdatePreferredLocaleRequest:
      type: object
      required: [locale]
      properties:
        locale:
          type: string
          enum: [ru, en]

    StatusOKResponse:
      description: |
        `{status:"ok"}` envelope used by ChangePassword. Distinct from
        `StatusOkResponse` (camelCase variant) used by review reply and
        review-refresh handlers.
      type: object
      required: [status]
      properties:
        status:
          type: string

    StatusOkResponse:
      description: |
        `{status:"ok"}` envelope used by reviewReply and refreshReviews.
        Enum-pinned variant of `StatusOKResponse`.
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ConsentRequiredResponse:
      type: object
      required: [code, missing]
      properties:
        code:
          type: string
          enum: [consent_required]
        missing:
          type: array
          items:
            type: string

    # ===================================================================
    # Consents
    # ===================================================================

    ReconsentRequest:
      type: object
      required: [policies]
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/ReconsentPolicy'

    ReconsentPolicy:
      type: object
      required: [slug, version]
      properties:
        slug:
          type: string
        version:
          type: string
        sha256:
          type: string

    VersionMismatchResponse:
      type: object
      required: [code, currentVersion]
      properties:
        code:
          type: string
          enum: [version_mismatch]
        currentVersion:
          type: string

    ListConsentsResponse:
      type: object
      required: [consents]
      properties:
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'

    ConsentRecord:
      type: object
      required: [slug, version, acceptedAt]
      properties:
        slug:
          type: string
        version:
          type: string
        sha256:
          type: string
        acceptedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
          nullable: true

    # ===================================================================
    # User-deletion
    # ===================================================================

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1

    SoleOwnerResponse:
      type: object
      required: [code, businesses]
      properties:
        code:
          type: string
          enum: [sole_owner_of_businesses]
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/SoleOwnerBusinessEntry'

    SoleOwnerBusinessEntry:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    PendingDeletionResponse:
      type: object
      required: [code, deletionDate, restoreUrl]
      properties:
        code:
          type: string
          enum: [account_pending_deletion]
        deletionDate:
          type: string
        restoreUrl:
          type: string

    # ===================================================================
    # Platforms / business / integrations
    # ===================================================================

    Platform:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/PlatformStatus'

    PlatformStatus:
      type: string
      enum:
        - active
        - coming_soon
        - oauth_not_configured

    Business:
      type: object
      required: [id, name, settings, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        address:
          type: string
        phone:
          type: string
        website:
          type: string
          nullable: true
        description:
          type: string
        logoUrl:
          type: string
        settings:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BusinessMembershipSummary:
      type: object
      required: [id, name, role, status, joined_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/BusinessMembershipRoleRef'
        status:
          type: string
        joined_at:
          type: string
          format: date-time

    BusinessMembershipRoleRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    CreateBusinessRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        category:
          type: string
        address:
          type: string
        phone:
          type: string
        website:
          type: string
          nullable: true
        description:
          type: string

    UpdateBusinessRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        category:
          type: string
        address:
          type: string
        phone:
          type: string
        website:
          type: string
          nullable: true
        description:
          type: string

    UpdateScheduleRequest:
      type: object
      properties:
        schedule:
          description: Free-form per-day schedule blob.
        specialDates:
          description: Optional special-date overrides.

    UpdateVoiceToneRequest:
      type: object
      properties:
        tones:
          type: array
          items:
            type: string

    UploadLogoRequest:
      type: object
      required: [logo]
      properties:
        logo:
          type: string
          format: binary

    ToolApprovalsResponse:
      type: object
      required: [toolApprovals]
      properties:
        toolApprovals:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ToolFloor'

    UpdateToolApprovalsRequest:
      type: object
      required: [toolApprovals]
      properties:
        toolApprovals:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ToolFloor'

    ToolFloor:
      type: string
      enum: [auto, manual, forbidden]
      description: |
        Per-tool HITL floor (strictness: auto < manual < forbidden).
        Business-level approvals only persist `auto` / `manual`;
        `forbidden` is reserved for tool-registry defaults.

    Integration:
      type: object
      required: [id, businessId, platform, status, externalId, metadata, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        platform:
          type: string
        status:
          type: string
        externalId:
          type: string
        metadata:
          type: object
          additionalProperties: true
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthURLResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string

    VKCommunity:
      type: object
      required: [id, name, screen_name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        screen_name:
          type: string
        photo_50:
          type: string
        members_count:
          type: integer

    GoogleLocationsResponse:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/GoogleLocationRef'

    GoogleLocationRef:
      type: object
      required: [account_name, location_name, title]
      properties:
        account_name:
          type: string
        location_name:
          type: string
        title:
          type: string

    GoogleSelectLocationRequest:
      type: object
      required: [account_id, location_id]
      properties:
        account_id:
          type: string
        location_id:
          type: string

    YandexCookiesRequest:
      type: object
      required: [cookies]
      properties:
        cookies:
          type: string

    YandexProbeResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        format:
          type: string
        session_valid:
          type: boolean
          nullable: true
        username:
          type: string
        warnings:
          type: array
          items:
            type: string
        error:
          type: string

    YandexCompaniesResponse:
      type: object
      required: [companies]
      properties:
        companies:
          type: array
          items:
            $ref: '#/components/schemas/YandexCompanyEntry'

    YandexCompanyEntry:
      type: object
      required: [permalink, name]
      properties:
        permalink:
          type: string
        name:
          type: string

    ConnectYandexRequest:
      type: object
      required: [cookies]
      properties:
        cookies:
          type: string
        permalink:
          type: string
        business_name:
          type: string

    RefreshStartedResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [refresh_started]

    ConnectVKRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
        group_id:
          type: string

    ConnectTelegramRequest:
      type: object
      required: [channel_id]
      properties:
        channel_id:
          type: string
        telegram_user_id:
          type: string

    RefreshTelegramRequest:
      type: object
      required: [channel_id]
      properties:
        channel_id:
          type: string

    RefreshTelegramResponse:
      type: object
      required: [linked_chat_id, linked_group_status, channel_title]
      properties:
        linked_chat_id:
          type: integer
          format: int64
        linked_group_status:
          type: string
          enum:
            - ok
            - bot_not_member
            - no_linked_group
        channel_title:
          type: string

    TelegramLoginRequest:
      type: object
      additionalProperties: true
      required: [hash, auth_date]
      properties:
        hash:
          type: string
        auth_date:
          oneOf:
            - type: string
            - type: integer
        id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        photo_url:
          type: string

    TelegramLoginVerifiedResponse:
      type: object
      required: [verified, user]
      properties:
        verified:
          type: boolean
        user:
          type: object
          additionalProperties: true

    # ===================================================================
    # Permissions / Members / Roles / Invitations / Audit
    # ===================================================================

    Permission:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    PermissionGroup:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    PermissionRegistryResponse:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PermissionGroup'

    MyPermissionsResponse:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items:
            type: string

    Member:
      type: object
      required: [user, role, status, joined_at, invited_by, invited_at]
      properties:
        user:
          type: object
          required: [id, email]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
        role:
          type: object
          required: [id, name, permissions]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            permissions:
              type: array
              items:
                type: string
        status:
          type: string
        joined_at:
          type: string
          format: date-time
        invited_by:
          type: string
          format: uuid
          nullable: true
        invited_at:
          type: string
          format: date-time
          nullable: true

    UpdateMemberRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid

    UpdateMemberRoleResponse:
      type: object
      required: [business_id, user_id, role_id, status]
      properties:
        business_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role_id:
          type: string
          format: uuid
