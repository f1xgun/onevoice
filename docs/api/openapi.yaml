          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Invitation not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '409':
          description: Invitation already accepted/revoked/expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /invitations/{token}:
    get:
