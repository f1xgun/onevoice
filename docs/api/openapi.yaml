        - auth.login_failed
        - auth.logout
        - auth.password_changed
        - auth.user_registered
        - integration.connected
        - integration.disconnected
        - integration.token_rotated
        - business.created
        - business.updated
        - project.created
        - project.updated
        - project.deleted

    AuditEvent:
      type: object
