        '400':
          description: '`invalid_user_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the target user and lacks `members.remove`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
