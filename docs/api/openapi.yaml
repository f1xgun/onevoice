          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks `roles.create` or attempts escalation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{id}/roles/{roleId}:
    patch:
      operationId: updateRole
      summary: Update a custom role.
      tags: [roles]
      parameters:
        - $ref: '#/components/parameters/BusinessIDPath'
        - $ref: '#/components/parameters/RoleIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: |
            `invalid_role_id`, `invalid_body`, `validation_failed`,
            `invalid_permission`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks `roles.update`, self-lockout, or escalation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found (or owned by another tenant — masked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '422':
          description: '`role_immutable` — system roles cannot be edited.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
