            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/BusinessNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /telemetry:
    post:
      operationId: ingestTelemetry
      summary: Ingest a batch of frontend telemetry events.
      tags: [telemetry]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/TelemetryEvent'
      responses:
        '204':
          description: Events accepted.
        '400':
          description: Invalid JSON or batch size exceeds 100.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =====================================================================
  # chat-proxy + HITL (api service)
  # =====================================================================

  /businesses/{id}/chat/{conversationID}:
    post:
      operationId: chatTurn
      summary: |
        Streaming chat turn. SSE response. Doubles as HITL resume trigger
        when `X-Onevoice-Resume-Batch-Id` or `?batch_id=` is set.
      tags: [chat]
      parameters:
        - $ref: '#/components/parameters/BusinessIDPath'
        - name: conversationID
          in: path
          required: true
          schema:
            type: string
        - name: X-Onevoice-Resume-Batch-Id
          in: header
          required: false
          schema:
            type: string
        - name: batch_id
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatTurnRequest'
      responses:
        '200':
          description: Streaming SSE response.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Newline-delimited SSE frames `data: <json>\n\n`. See
                  components.schemas.SSEEvent for the union type.
              x-sse-events:
                text:                   { $ref: '#/components/schemas/SSEEventText' }
                tool_call:              { $ref: '#/components/schemas/SSEEventToolCall' }
                tool_result:            { $ref: '#/components/schemas/SSEEventToolResult' }
                tool_rejected:          { $ref: '#/components/schemas/SSEEventToolRejected' }
                tool_approval_required: { $ref: '#/components/schemas/SSEEventApprovalRequired' }
                done:                   { $ref: '#/components/schemas/SSEEventDone' }
                error:                  { $ref: '#/components/schemas/SSEEventError' }
        '400':
          description: Missing message body, or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing `content:create` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Business not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            Per-user SSE concurrency cap exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSEConcurrencyError'
        '502':
          description: Orchestrator unavailable (pre-stream).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            Rate-limit backing store unavailable (`rate_limit_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /businesses/{id}/chat/{conversationID}/resume:
    post:
      operationId: hitlResume
      summary: |
        Resume a paused HITL batch. SSE response — same event schema as
        chatTurn.
      tags: [chat, hitl]
      parameters:
        - $ref: '#/components/parameters/BusinessIDPath'
        - name: conversationID
          in: path
          required: true
          schema:
            type: string
        - name: batch_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Streaming SSE.
          content:
            text/event-stream:
              schema:
                type: string
              x-sse-events:
                text:                   { $ref: '#/components/schemas/SSEEventText' }
                tool_call:              { $ref: '#/components/schemas/SSEEventToolCall' }
                tool_result:            { $ref: '#/components/schemas/SSEEventToolResult' }
                tool_rejected:          { $ref: '#/components/schemas/SSEEventToolRejected' }
                tool_approval_required: { $ref: '#/components/schemas/SSEEventApprovalRequired' }
                done:                   { $ref: '#/components/schemas/SSEEventDone' }
                error:                  { $ref: '#/components/schemas/SSEEventError' }
        '400':
          description: Missing `batch_id` query param.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Missing permission OR batch/conversation mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Business or batch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Batch already resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLAlreadyResolvedError'
        '410':
          description: Approval window expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLExpiredError'
        '502':
          description: Orchestrator unavailable (pre-stream).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}/conversations/{conversationID}/pending-tool-calls/{batch_id}/resolve:
    post:
      operationId: hitlResolveBatch
      summary: Approve / edit / reject a pending HITL tool-call batch.
      tags: [hitl]
      parameters:
        - $ref: '#/components/parameters/BusinessIDPath'
        - name: conversationID
          in: path
          required: true
          schema:
            type: string
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HITLResolveRequest'
      responses:
        '200':
          description: Resolve succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLResolveResponse'
        '400':
          description: |
            Missing path params, malformed body, shape mismatch, edit
            rejected, non-scalar edit value, or reject_reason too long.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/HITLShapeMismatchError'
                  - $ref: '#/components/schemas/HITLFieldNotEditableError'
                  - $ref: '#/components/schemas/HITLNonScalarFieldError'
                  - $ref: '#/components/schemas/HITLRejectReasonTooLongError'
        '403':
          description: Missing `content:update` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Batch not found (also cross-tenant — uniform 404).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Concurrent resolve in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLBatchResolvingError'
        '410':
          description: Batch already expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HITLExpiredError'

  /businesses/{id}/tools:
    get:
      operationId: hitlGetTools
      summary: Tools registry projection (5-minute cache).
      tags: [hitl]
      parameters:
        - $ref: '#/components/parameters/BusinessIDPath'
      responses:
        '200':
          description: Live registry projection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolEntry'

  # =====================================================================
  # Conversations
  # =====================================================================

  /businesses/{id}/conversations:
    get:
      operationId: listConversations
      summary: List the caller's conversations in the business.
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/BusinessIDPath'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Conversation list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '403':
          description: Missing `content:read` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createConversation
      summary: Create a conversation; optional project assignment.
      tags: [conversations]
      parameters:
        - $ref: '#/components/parameters/BusinessIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Invalid body, or invalid project id.
          content:
            application/json:
