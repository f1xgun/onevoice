        '409':
          description: Last-owner invariant would be violated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{id}/roles:
