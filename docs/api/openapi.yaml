openapi: 3.0.3
info:
  title: OneVoice API
  version: 1.0.0
  description: |
    Consolidated OpenAPI contract covering both the api service
    (services/api, port 8080, base `/api/v1`) and the orchestrator service
    (services/orchestrator, port 8090, no version prefix).

    Default security: `cookieAuth` (access_token cookie). Public endpoints
    declare `security: []`. Cluster-internal endpoints declare
    `security: [{mtls: []}]` and live on the mTLS listener — the public
    reverse proxy MUST drop matching prefixes.

    Orchestrator endpoints carry a per-operation `servers:` override so
    they document the cluster-internal base URL (`http://orchestrator:8090`)
    while the rest of the spec remains under `/api/v1`. The whole spec is
    one file for code-generator simplicity.

    Error envelope diverges by endpoint:
      - Free-form messages use `{"error":"<string>"}` (`ErrorResponse`).
      - Machine-routable failures use `{"code":"<code>"}`
        (`CodeErrorResponse`) — frontend i18n routes on the `code` field.
      - The internal billing endpoints use `BillingErrorResponse`
        (a distinct shape with both `error` and `detail`).

    Streaming responses (chat / resume / tasks-stream) document themselves
    as `text/event-stream` with a string schema for the raw frame bytes
    and a vendor `x-sse-events` extension mapping event-type discriminator
    values to per-event JSON schemas. Generators that ignore the extension
    can still consume `SSEEvent` (oneOf union under components.schemas).

servers:
  - url: /api/v1
    description: Public api service (services/api, port 8080).

security:
  - cookieAuth: []

tags:
  - name: auth
    description: Authentication, password reset, email verification, locale.
  - name: business
    description: Business CRUD + schedule + voice-tone + logo + tool-approvals.
  - name: integrations
    description: Per-business integration list + connect helpers (Telegram, VK).
  - name: oauth
    description: OAuth helpers and callbacks (VK, Yandex.Business, Google).
  - name: consents
    description: Policy reconsent + ledger + PDN withdrawal.
  - name: user-deletion
    description: 30-day soft-delete grace flow.
  - name: members
    description: Business membership rows.
  - name: roles
    description: System + custom RBAC roles.
  - name: invitations
    description: Single-use invitation tokens.
  - name: permissions
    description: RBAC permission registry.
  - name: audit
    description: Business audit log with cursor pagination.
  - name: telemetry
    description: Frontend telemetry ingest.
  - name: chat
    description: Chat-proxy SSE + HITL resume + tools registry.
  - name: hitl
    description: Human-in-the-loop tool approval surface.
  - name: hitl-resume
    description: Post-approval continuation of a paused chat turn.
  - name: conversations
    description: Conversation CRUD + move/pin/unpin/messages.
  - name: posts
    description: Posts read surface.
  - name: reviews
    description: Reviews list/get/reply + cross-business refresh.
  - name: projects
    description: Project CRUD + cascade delete.
  - name: tasks
    description: Agent-task list + SSE lifecycle stream.
  - name: search
    description: Full-text conversation/message search.
  - name: titler
    description: Auto-titler regenerate trigger.
  - name: internal
    description: Cluster-only endpoints (mTLS). Not exposed publicly.

paths:

  # =====================================================================
  # auth
  # =====================================================================

  /auth/login:
    post:
      operationId: login
      summary: Exchange email + password for an access token and refresh cookie.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded; refresh token set as HttpOnly cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: |
            Malformed body, validation failure, or `captcha_required` when
            the lockout middleware demands a SmartCaptcha token but none was
            supplied via `X-Captcha-Token`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/CodeErrorResponse'
        '401':
          description: Invalid credentials. Lockout counter is incremented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: SmartCaptcha verification failed (`captcha_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '423':
          description: |
            Account locked by the lockout middleware (`account_locked`).
            Emitted before this handler runs; documented here for completeness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the refresh token bound to the request cookie.
      tags: [auth]
      responses:
        '204':
          description: Logout succeeded (or no cookie was present — idempotent).
        '401':
          description: Refresh token was supplied but is invalid or already revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Logout service failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token cookie and mint a new access token.
      tags: [auth]
      responses:
        '200':
          description: Rotation succeeded; new refresh cookie set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Missing or invalid refresh cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure during rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/me:
    get:
      operationId: getMe
      summary: Return the authenticated user's profile and reconsent state.
      tags: [auth]
      responses:
        '200':
          description: Authenticated user payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or expired access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User row not found (e.g. hard-deleted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal lookup failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/register:
    post:
      operationId: register
      summary: Register a new user, accept consents, and auto-login.
      description: |
        Creates the user row, writes the three required policy acceptances
        (TOS / Privacy / PDN) in the same transaction, enqueues the
        verification email, then auto-logs the user in (same as
        /auth/login). 400 `consent_required` when any of the three
        submitted versions disagrees with the build's currentVersion.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration succeeded; access token returned and refresh cookie set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: |
            Validation failure or `consent_required` (carries the list of
            missing policy slugs).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ConsentRequiredResponse'
        '409':
          description: User with this email already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Registration or auto-login failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Send a password-reset email to the supplied address.
      description: |
        Always returns 204 regardless of whether the email is registered —
        the service handles per-email rate-limit, dummy-audit-on-unknown
        email, and outbox enqueue with symmetric timing across branches.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestPasswordResetRequest'
      responses:
        '204':
          description: Request accepted (regardless of email existence).
        '400':
          description: Malformed body or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Consume a password-reset token and rotate the password.
      description: |
        On success the service has consumed the token, rotated the
        password hash, and wiped all refresh tokens for the user.
        POST-only (scanner-protection against link prefetch).
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPasswordResetRequest'
      responses:
        '204':
          description: Password rotated.
        '400':
          description: Invalid, expired, or already-used token, or validation failure.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/CodeErrorResponse'

  /auth/verify-email/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Confirm an email-verification token.
      description: |
        Public — token IS the proof. CRITICAL: no Set-Cookie is emitted,
        so an attacker who registered with a victim's email cannot
        thereby become the victim's session. POST-only.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyConfirmRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          description: |
            Token invalid (`verify_token_invalid`) or expired
            (`verify_token_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email/resend:
    post:
      operationId: resendEmailVerification
      summary: Resend the email-verification mail for the authenticated user.
      tags: [auth]
      responses:
        '204':
          description: Resend enqueued.
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: User is already verified (`email_already_verified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '429':
          description: Resend throttle hit (`verify_resend_throttled`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/email-before-verify:
    patch:
      operationId: changeEmailBeforeVerify
      summary: Change the unverified user's email before verification.
      description: |
        Only allowed while `email_verified=false`; otherwise 403
        `email_already_verified`. On success the old verification token
        is invalidated and a new one is mailed.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBeforeVerifyRequest'
      responses:
        '204':
          description: Email rotated; new verification mail enqueued.
        '400':
          description: Validation failure or malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Already verified (`email_already_verified`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '409':
          description: New email taken (`email_taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/password:
    put:
      operationId: changePassword
      summary: Change the authenticated user's password.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOKResponse'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Current password incorrect, or unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  /auth/locale:
    patch:
      operationId: updatePreferredLocale
      summary: Update the authenticated user's preferred locale.
      description: |
        Deliberately does NOT read Accept-Language — locale persistence
        is an explicit user action. Allowed values: `ru`, `en`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferredLocaleRequest'
      responses:
        '204':
          description: Locale updated.
        '400':
          description: Validation failure (locale outside allow-list).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'

  # =====================================================================
  # consents
  # =====================================================================

  /auth/consents:
    post:
      operationId: reconsent
      summary: Submit the re-consent modal (Surface E).
      description: |
        Auth-required; never gated by RequireVerifiedEmail* or
        BlockWritesDuringGrace (right-to-withdraw, 152-ФЗ Art. 21).
        Origin header is required (CSRF defense).
      tags: [consents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconsentRequest'
      responses:
        '204':
          description: Consents recorded.
        '400':
          description: |
            `consent_required` (missing slugs) or malformed body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/ConsentRequiredResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin header missing or not allow-listed (`origin_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '409':
          description: |
            `version_mismatch` — the build's currentVersion bumped since
            the modal was rendered. Body carries the new currentVersion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionMismatchResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/consents:
    get:
      operationId: listMyConsents
      summary: Return the authenticated user's consent ledger.
      tags: [consents]
      responses:
        '200':
          description: Consent rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConsentsResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/consents/pdn/withdraw:
    post:
      operationId: withdrawPDNConsent
      summary: Withdraw the PDN consent (triggers account deletion).
      description: |
        Withdrawal of the PDN consent triggers the deletion flow. 423
        `account_pending_deletion` when the user is already mid-deletion.
        Origin header required (CSRF defense).
      tags: [consents]
      responses:
        '204':
          description: PDN consent withdrawn; deletion flow started.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin header missing or not allow-listed (`origin_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '404':
          description: User row missing (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '423':
          description: Deletion already pending (`account_pending_deletion`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingDeletionResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =====================================================================
  # user-deletion
  # =====================================================================

  /users/me:
    delete:
      operationId: deleteAccount
      summary: Request account deletion (30-day grace window).
      description: |
        Server-side password re-verification defends against XSS-stolen
        JWT scenarios. On success the row is soft-deleted and a 30-day
        grace window starts; the user can call /users/me/restore until
        the grace expires.
      tags: [user-deletion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Deletion requested; grace window active.
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            Unauthorized, or password re-verification failed
            (`password_invalid`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/CodeErrorResponse'
        '404':
          description: User row missing (`user_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Sole owner of one or more businesses
            (`sole_owner_of_businesses`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoleOwnerResponse'
        '423':
          description: Deletion already pending (`account_pending_deletion`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingDeletionResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/restore:
    post:
      operationId: restoreAccount
      summary: Cancel a pending account deletion within the grace window.
      description: |
        CSRF defense: Origin header MUST match an allowed CORS origin.
        Outside the 30-day grace the row may already be purged; the
        handler returns 410 `deletion_too_old` in that case.
      tags: [user-deletion]
      responses:
        '204':
          description: Deletion canceled; account restored.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin header missing or not allow-listed (`origin_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '404':
          description: No deletion pending (`no_deletion_pending`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '410':
          description: Grace window expired and the row is purged (`deletion_too_old`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =====================================================================
  # platforms (public)
  # =====================================================================

  /platforms:
    get:
      operationId: listPlatforms
      summary: List the integration platform registry.
      description: |
        Unauthenticated — the marketing landing page renders this without
        a token. Only non-sensitive platform metadata is returned. Cached
        for 60s.
      tags: [integrations]
      security: []
      responses:
        '200':
          description: Platform registry rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Platform'

  # =====================================================================
  # business
  # =====================================================================

  /businesses:
    get:
      operationId: listUserBusinesses
      summary: List businesses the authenticated user is a member of.
      tags: [business]
      responses:
        '200':
          description: Membership rows hydrated with business name + role.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusinessMembershipSummary'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createBusiness
      summary: Create a new business and owner membership for the caller.
      description: |
        Subject to a day-7 soft-restrict on unverified accounts when
        configured. On success the caller becomes the OWNER member.
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: Business created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business already exists (`business_already_exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}:
    parameters:
      - $ref: '#/components/parameters/BusinessIDPath'
    get:
      operationId: getBusiness
      summary: Return the business profile.
      tags: [business]
      responses:
        '200':
          description: Business profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            Business not found OR caller is not a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: updateBusiness
      summary: Update the business profile.
      tags: [business]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
      responses:
        '200':
          description: Updated business profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Business not found or caller not a member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /businesses/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/BusinessIDPath'
    put:
      operationId: updateBusinessSchedule
      summary: Update the business schedule.
      tags: [business]
      requestBody:
