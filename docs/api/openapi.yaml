          required: false
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Role deleted (and members reassigned, when applicable).
        '400':
          description: |
            `invalid_role_id`, `invalid_reassign_to`, or `role_in_use`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller lacks `roles.delete`, or target role escalates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '422':
          description: '`role_immutable` — system roles cannot be deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{id}/invitations:
