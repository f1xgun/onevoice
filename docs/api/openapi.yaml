        external_id:
          type: string
        access_token:
          type: string
        user_token:
          type: string
        metadata:
          type: object
          additionalProperties: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        user_token_expires_at:
          type: string
          format: date-time
          nullable: true

    UsageLog:
      type: object
      required: [business_id, user_id, model, provider, input_tokens, output_tokens, provider_cost_usd, commission_usd, user_cost_usd, user_tier]
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        conversation_id:
          type: string
        request_id:
          type: string
        model:
          type: string
        provider:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cache_read_tokens:
          type: integer
          minimum: 0
        cache_creation_tokens:
          type: integer
          minimum: 0
        provider_cost_usd:
          type: number
          format: double
        commission_usd:
          type: number
          format: double
        user_cost_usd:
          type: number
          format: double
        user_tier:
          type: string
        created_at:
          type: string
          format: date-time

    DailySpendResponse:
      type: object
      required: [daily_spend_usd]
      properties:
        daily_spend_usd:
          type: number
          format: double

    # ===================================================================
    # Chat-proxy + HITL (api side)
    # ===================================================================

    ChatTurnRequest:
      type: object
      properties:
        message:
          type: string
        model:
          type: string

    SSEConcurrencyError:
      type: object
      required: [code, retry_after_s]
      properties:
        code:
          type: string
          enum: [sse_concurrency_exceeded]
        retry_after_s:
          type: integer

    HITLResolveRequest:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/HITLDecisionInput'

    HITLDecisionInput:
      type: object
      required: [id, action]
      properties:
        id:
          type: string
        action:
          type: string
          enum: [approve, edit, reject]
        edited_args:
          type: object
          additionalProperties: true
        reject_reason:
          type: string

    HITLResolveResponse:
      type: object
      required: [batch_id, resolved_at, decisions]
      properties:
        batch_id:
          type: string
        resolved_at:
          type: string
          format: date-time
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/HITLResolvedCall'

    HITLResolvedCall:
      type: object
      required: [id, action]
      properties:
        id:
          type: string
        action:
          type: string
          enum: [approve, edit, reject]
        reason:
          type: string

    HITLShapeMismatchError:
      type: object
      required: [error, missing]
      properties:
        error:
          type: string
          enum: ['shape mismatch']
        missing:
          type: array
          items:
            type: string

    HITLFieldNotEditableError:
      type: object
      required: [error, editable]
      properties:
        error:
          type: string
        editable:
          type: array
          items:
            type: string

    HITLNonScalarFieldError:
      type: object
      required: [error, tool]
      properties:
        error:
          type: string
        tool:
          type: string

    HITLRejectReasonTooLongError:
      type: object
      required: [error, max]
      properties:
        error:
          type: string
          enum: ['reject_reason too long']
        max:
          type: integer

    HITLBatchResolvingError:
      type: object
      required: [error, retry_after_ms, reason]
      properties:
        error:
          type: string
          enum: ['batch resolving']
        retry_after_ms:
          type: integer
        reason:
          type: string
          enum: ['concurrent resolve in progress']

    HITLExpiredError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [approval_expired]

    HITLAlreadyResolvedError:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
          enum: ['batch already resolved']
        reason:
          type: string
          enum: [already_resolved]

    ToolEntry:
      description: |
        Locale-resolved tool registry projection returned by the api
        service's hitlGetTools (cached 5 minutes). The `floor` here is the
        wire-effective HITL floor — `auto` or `manual`. Distinct from
        `ToolRegistryEntry` which is the orchestrator's internal-only
        projection that may carry `forbidden`.
      type: object
      required: [name, displayName, platform, floor, editableFields, description, userDescription]
      properties:
        name:
          type: string
        displayName:
          type: string
        displayNameKey:
          type: string
        platform:
          type: string
        floor:
          type: string
          enum: [auto, manual]
        editableFields:
          type: array
          items:
            type: string
        description:
          type: string
        userDescription:
          type: string

    Conversation:
      type: object
      required: [id, userId, businessId, title, titleStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        projectId:
          type: string
          nullable: true
        title:
          type: string
        titleStatus:
          type: string
          enum: [auto_pending, auto, manual]
        pinnedAt:
          type: string
          format: date-time
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        projectId:
          type: string
          nullable: true

    UpdateConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200

    MoveConversationRequest:
      type: object
      properties:
        projectId:
          type: string
          nullable: true

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: string
        conversationId:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MessageAttachment'
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/MessageToolCall'
        toolResults:
          type: array
          items:
            $ref: '#/components/schemas/MessageToolResult'
        metadata:
          type: object
          additionalProperties: true
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    MessageAttachment:
      type: object
      required: [type, url, mimeType, name]
      properties:
        type:
          type: string
        url:
          type: string
        mimeType:
          type: string
        name:
          type: string

    MessageToolCall:
      type: object
      required: [id, name, arguments]
      properties:
        id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        approvalId:
          type: string
        status:
          type: string

    MessageToolResult:
      type: object
      required: [toolCallId, content, isError]
      properties:
        toolCallId:
          type: string
        content:
          type: object
          additionalProperties: true
        isError:
          type: boolean
        code:
          type: string

    ChatView:
      type: object
      required: [messages, pendingApprovals]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        pendingApprovals:
          type: array
          items:
            $ref: '#/components/schemas/PendingApproval'

    PendingApproval:
      type: object
      required: [batchId, messageId, calls, status, createdAt, expiresAt]
      properties:
        batchId:
          type: string
        messageId:
          type: string
        calls:
          type: array
          items:
            $ref: '#/components/schemas/PendingApprovalCall'
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    PendingApprovalCall:
      type: object
      required: [callId, toolName, args, editableFields]
      properties:
        callId:
          type: string
        toolName:
          type: string
        args:
          type: object
          additionalProperties: true
        editableFields:
          type: array
          items:
            type: string

    TitlerConflictError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [title_is_manual, title_in_flight, title_state_changed]
        message:
          type: string

    TitlerDisabledError:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum: [titler_disabled]
        message:
          type: string

    Project:
      type: object
      required: [id, businessId, name, whitelistMode, allowedTools, quickActions, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
          maxLength: 4000
        whitelistMode:
          type: string
          enum: [inherit, all, explicit, none]
        allowedTools:
          type: array
          items:
            type: string
        approvalOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [auto, manual]
        quickActions:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        systemPrompt:
          type: string
          maxLength: 4000
        whitelistMode:
          type: string
          enum: [inherit, all, explicit, none]
        allowedTools:
          type: array
          items:
            type: string
        approvalOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [auto, manual, inherit]
        quickActions:
          type: array
          items:
            type: string

    ProjectDeleteResponse:
      type: object
      required: [deletedConversations, deletedMessages]
      properties:
        deletedConversations:
          type: integer
        deletedMessages:
          type: integer

    ProjectConversationCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    Post:
      type: object
      required: [id, businessId, content, status, createdAt]
      properties:
        id:
          type: string
        businessId:
          type: string
          format: uuid
        content:
          type: string
        mediaUrls:
          type: array
          items:
            type: string
        platformResults:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PostPlatformResult'
        status:
          type: string
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    PostPlatformResult:
      type: object
      required: [postId, url, status]
      properties:
        postId:
          type: string
        url:
          type: string
        status:
          type: string
        error:
          type: string

    PostListResponse:
      type: object
      required: [posts, total]
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        total:
          type: integer

    Review:
      type: object
      required: [id, businessId, platform, externalId, authorName, rating, text, replyStatus, createdAt]
      properties:
        id:
          type: string
        businessId:
          type: string
          format: uuid
        platform:
          type: string
        externalId:
          type: string
        authorName:
          type: string
        rating:
          type: integer
        text:
          type: string
        replyText:
          type: string
        replyStatus:
          type: string
          enum: [pending, replied, error]
        platformMeta:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        draftReply:
          type: string
        draftStatus:
          type: string
          enum: [generating, ready, failed]
        draftGeneratedAt:
          type: string
          format: date-time
        draftError:
          type: string

    ReviewListResponse:
      type: object
      required: [reviews, total]
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        total:
          type: integer

    ReplyToReviewRequest:
      type: object
      required: [replyText]
      properties:
        replyText:
          type: string

    AgentTask:
      type: object
      required: [id, businessId, type, status, platform, createdAt]
      properties:
        id:
          type: string
        businessId:
          type: string
          format: uuid
        type:
          type: string
        displayName:
          type: string
        displayNameKey:
          type: string
        status:
          type: string
        platform:
          type: string
        input:
          description: Free-form per-task input payload.
        output:
          description: Free-form per-task output payload.
        error:
          type: string
        errorCode:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AgentTaskListResponse:
      type: object
      required: [tasks, total]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/AgentTask'
        total:
          type: integer

    SearchResult:
      type: object
      required: [conversationId, matchCount, score]
      properties:
        conversationId:
          type: string
        title:
          type: string
        projectId:
          type: string
          nullable: true
        snippet:
          type: string
        matchCount:
          type: integer
        topMessageId:
          type: string
        score:
          type: number
          format: double
        marks:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
        lastMessageAt:
          type: string
          format: date-time
          nullable: true

    # ===================================================================
    # Orchestrator service
    # ===================================================================

    ChatRequest:
      type: object
      required: [message]
      properties:
        model:
          type: string
        message:
          type: string
        business_id:
          type: string
          format: uuid
        business_name:        { type: string }
        business_category:    { type: string }
        business_address:     { type: string }
        business_phone:       { type: string }
        business_website:     { type: string }
        business_description: { type: string }
        business_voice_tone:
          type: array
          items: { type: string }
        active_integrations:
          type: array
          items: { type: string }
        history:
          type: array
          items: { $ref: '#/components/schemas/ChatHistoryEntry' }
        project_id:           { type: string }
        project_name:         { type: string }
        project_system_prompt: { type: string }
        project_whitelist_mode:
          type: string
          enum: [inherit, all, explicit, none, ""]
        project_allowed_tools:
          type: array
          items: { type: string }
        user_id:
          type: string
        message_id: { type: string }
        tier:       { type: string }
        business_approvals:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ToolFloor' }
        project_approval_overrides:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ToolFloor' }
        locale:
          type: string

    ChatHistoryEntry:
      type: object
      required: [role, content]
      properties:
        role:    { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }

    ResumeRequest:
      type: object
      properties:
        business_approvals:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ToolFloor' }
        project_approval_overrides:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ToolFloor' }
        active_integrations:
          type: array
          items: { type: string }
        whitelist_mode:
          type: string
          enum: [inherit, all, explicit, none, ""]
        allowed_tools:
          type: array
          items: { type: string }
        model: { type: string }
        tier:  { type: string }

    DraftReplyRequest:
      type: object
      required: [reviewText, businessId, platform, rating]
      properties:
        businessId:          { type: string }
        businessName:        { type: string }
        businessCategory:    { type: string }
        businessDescription: { type: string }
        platform:            { type: string }
        reviewText:          { type: string }
        rating:
          type: integer
          minimum: 0
          maximum: 5
        authorName: { type: string }
        examples:
          type: array
          items: { $ref: '#/components/schemas/DraftReplyExample' }

    DraftReplyExample:
      type: object
      required: [reviewText, replyText]
      properties:
        reviewText: { type: string }
        replyText:  { type: string }
        rating:
          type: integer
          minimum: 0
          maximum: 5

    DraftReplyResponse:
      type: object
      required: [draftReply]
      properties:
        draftReply: { type: string }
        provider:   { type: string }
        model:      { type: string }

    ToolNamesResponse:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items: { type: string }

    ToolRegistryEntry:
      description: |
        Orchestrator's internal tool registry projection. The `floor` may
        carry `forbidden` (in addition to `auto` / `manual`); the api side
        uses `ToolEntry` (auto/manual only).
      type: object
      required: [name, displayName, platform, floor, editableFields, description, userDescription]
      properties:
        name:           { type: string }
        displayName:    { type: string }
        displayNameKey: { type: string }
        platform:       { type: string }
        floor:          { $ref: '#/components/schemas/ToolFloor' }
        editableFields:
          type: array
          items: { type: string }
        description:     { type: string }
        userDescription: { type: string }

    # ===================================================================
    # SSE event union (orchestrator + chat-proxy passthrough)
    # ===================================================================

    SSEEvent:
      description: |
        Discriminated union over the per-type SSE event schemas. `type`
        is the discriminator. Wire envelope is `data: <json>\n\n`.
      oneOf:
        - $ref: '#/components/schemas/SSEEventText'
        - $ref: '#/components/schemas/SSEEventToolCall'
        - $ref: '#/components/schemas/SSEEventToolResult'
        - $ref: '#/components/schemas/SSEEventToolRejected'
        - $ref: '#/components/schemas/SSEEventApprovalRequired'
        - $ref: '#/components/schemas/SSEEventDone'
        - $ref: '#/components/schemas/SSEEventError'
      discriminator:
        propertyName: type
        mapping:
          text:                   '#/components/schemas/SSEEventText'
          tool_call:              '#/components/schemas/SSEEventToolCall'
          tool_result:            '#/components/schemas/SSEEventToolResult'
          tool_rejected:          '#/components/schemas/SSEEventToolRejected'
          tool_approval_required: '#/components/schemas/SSEEventApprovalRequired'
          done:                   '#/components/schemas/SSEEventDone'
          error:                  '#/components/schemas/SSEEventError'

    SSEEventText:
      type: object
      required: [type]
      properties:
        type:    { type: string, enum: [text] }
        content: { type: string }

    SSEEventToolCall:
      type: object
      required: [type]
      properties:
        type:                  { type: string, enum: [tool_call] }
        tool_call_id:          { type: string }
        tool_name:             { type: string }
        tool_display_name:     { type: string }
        tool_display_name_key: { type: string }
        tool_args:
          type: object
          additionalProperties: true

    SSEEventToolResult:
      type: object
      required: [type]
      properties:
        type:                  { type: string, enum: [tool_result] }
        tool_call_id:          { type: string }
        tool_name:             { type: string }
        tool_display_name:     { type: string }
        tool_display_name_key: { type: string }
        result:
          description: Tool reply payload (any JSON).
          nullable: true
        error:
          type: string

    SSEEventToolRejected:
      type: object
      required: [type]
      properties:
        type:                  { type: string, enum: [tool_rejected] }
        tool_call_id:          { type: string }
        tool_name:             { type: string }
        tool_display_name:     { type: string }
        tool_display_name_key: { type: string }
        error:                 { type: string }

    SSEEventApprovalRequired:
      type: object
      required: [type, batch_id, calls]
      properties:
        type:     { type: string, enum: [tool_approval_required] }
        batch_id: { type: string }
        calls:
          type: array
          items: { $ref: '#/components/schemas/ApprovalCall' }

    SSEEventDone:
      type: object
      required: [type]
      properties:
        type:    { type: string, enum: [done] }
        content: { type: string }

    SSEEventError:
      type: object
      required: [type]
      properties:
        type:    { type: string, enum: [error] }
        code:    { type: string }
        content: { type: string }

    ApprovalCall:
      type: object
      required: [call_id, tool_name, args, editable_fields, floor]
      properties:
        call_id:   { type: string }
        tool_name: { type: string }
        args:
          type: object
          additionalProperties: true
        editable_fields:
          type: array
          items: { type: string }
        floor: { $ref: '#/components/schemas/ToolFloor' }
