/businesses:
  get:
    operationId: listUserBusinesses
    summary: List businesses the authenticated user is a member of.
    tags:
    - business
    responses:
      '200':
        description: Membership rows hydrated with business name + role.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../openapi.yaml#/components/schemas/BusinessMembershipSummary
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
  post:
    operationId: createBusiness
    summary: Create a new business and owner membership for the caller.
    description: |
      Subject to a day-7 soft-restrict on unverified accounts when
      configured. On success the caller becomes the OWNER member.
    tags:
    - business
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/CreateBusinessRequest
    responses:
      '201':
        description: Business created.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Business
      '400':
        description: Validation failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '401':
        description: Unauthorized.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '409':
        description: Business already exists (`business_already_exists`).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  get:
    operationId: getBusiness
    summary: Return the business profile.
    tags:
    - business
    responses:
      '200':
        description: Business profile.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Business
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: |
          Business not found OR caller is not a member.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
  put:
    operationId: updateBusiness
    summary: Update the business profile.
    tags:
    - business
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/UpdateBusinessRequest
    responses:
      '200':
        description: Updated business profile.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Business
      '400':
        description: Validation failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Business not found or caller not a member.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
  delete:
    operationId: deleteBusiness
    summary: Request organization deletion (30-day grace window).
    description: |
      Owner-only. On success the organization row is soft-deleted and a
      30-day grace window starts; an OWNER can call
      /businesses/{id}/restore until the grace expires. Idempotent — a
      second call returns 423.
    tags:
    - business
    responses:
      '204':
        description: Deletion requested; grace window active.
      '403':
        description: |
          Caller is not an OWNER of the organization
          (`not_organization_owner`).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CodeErrorResponse
      '404':
        description: Organization not found or caller not a member.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '423':
        description: Deletion already pending (`business_pending_deletion`).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/PendingDeletionResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/restore:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: restoreBusiness
    summary: Cancel a pending organization deletion within the grace window.
    description: |
      Owner-only. CSRF defense: Origin header MUST match an allowed CORS
      origin. Outside the 30-day grace the row may already be purged; the
      handler returns 410 `deletion_too_old` in that case.
    tags:
    - business
    responses:
      '204':
        description: Deletion canceled; organization restored.
      '403':
        description: |
          Caller is not an OWNER (`not_organization_owner`), or Origin
          header missing / not allow-listed (`origin_not_allowed`).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CodeErrorResponse
      '404':
        description: No deletion pending (`no_deletion_pending`).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CodeErrorResponse
      '410':
        description: Grace window expired and the row is purged (`deletion_too_old`).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CodeErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
