/businesses/{id}/tasks:
  get:
    operationId: listAgentTasks
    tags:
    - tasks
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: platform
      in: query
      required: false
      schema:
        type: string
    - name: status
      in: query
      required: false
      schema:
        type: string
    - name: type
      in: query
      required: false
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    responses:
      '200':
        description: Tasks list + total.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AgentTaskListResponse
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/tasks/stream:
  get:
    operationId: streamAgentTasks
    summary: SSE stream of task lifecycle events.
    tags:
    - tasks
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    responses:
      '200':
        description: Streaming task events.
        content:
          text/event-stream:
            schema:
              type: string
            x-sse-events:
              task.created:
                $ref: ../openapi.yaml#/components/schemas/AgentTask
              task.updated:
                $ref: ../openapi.yaml#/components/schemas/AgentTask
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Streaming not supported by the writer.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/tasks/{taskId}/rerun:
  post:
    operationId: rerunAgentTaskVerification
    summary: Repeat readonly verification of a successful external action.
    tags: [tasks]
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: taskId
      in: path
      required: true
      schema: {type: string}
    responses:
      '202':
        description: Verification queued. This operation never repeats the external write.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AgentTask
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Business or task not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '409':
        description: Verification is already pending or running.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '422':
        description: The task cannot be verified from persisted intent/read capabilities.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
