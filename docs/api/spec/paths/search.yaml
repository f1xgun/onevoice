/businesses/{id}/search:
  get:
    operationId: search
    summary: Conversation + message full-text search.
    tags:
    - search
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 2
    - name: project_id
      in: query
      required: false
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 50
    responses:
      '200':
        description: Ordered search hits.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../openapi.yaml#/components/schemas/SearchResult
      '400':
        description: Query string too short.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '503':
        description: Index not ready (cold-boot).
        headers:
          Retry-After:
            schema:
              type: integer
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
