/businesses/{id}/posts:
  get:
    operationId: listPosts
    tags:
    - posts
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: platform
      in: query
      required: false
      schema:
        type: string
    - name: status
      in: query
      required: false
      schema:
        type: string
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    responses:
      '200':
        description: Posts list + total.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/PostListResponse
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/posts/{postID}:
  get:
    operationId: getPost
    tags:
    - posts
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: postID
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Post.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Post
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Post or business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
