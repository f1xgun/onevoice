/platforms:
  get:
    operationId: listPlatforms
    summary: List the integration platform registry.
    description: |
      Unauthenticated — the marketing landing page renders this without
      a token. Only non-sensitive platform metadata is returned. Cached
      for 60s.
    tags:
    - integrations
    security: []
    responses:
      '200':
        description: Platform registry rows.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../openapi.yaml#/components/schemas/Platform
/businesses/{id}/integrations:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  get:
    operationId: listIntegrations
    summary: List integrations for the business.
    tags:
    - integrations
    responses:
      '200':
        description: Integration rows (empty array if none).
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../openapi.yaml#/components/schemas/Integration
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/verify:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: verifyIntegrations
    summary: Re-verify and repair the business's connected integrations.
    description: |
      Triggers an async profile re-push + drift reschedule (repair) and returns
      the synchronously-computed per-integration connection-health array. Health
      is fail-soft: an inconclusive probe never demotes a working channel.
    tags:
    - integrations
    responses:
      '202':
        description: Repair started; per-integration health computed.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/VerifyIntegrationsResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/{integrationId}:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  - $ref: ../openapi.yaml#/components/parameters/IntegrationIDPath
  delete:
    operationId: deleteIntegration
    summary: Disconnect (delete) an integration.
    tags:
    - integrations
    responses:
      '204':
        description: Integration deleted.
      '400':
        description: Invalid integration ID.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Integration not found in this business.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/vk/connect:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: connectVK
    summary: Persist a pasted VK community access token as an integration.
    tags:
    - integrations
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ConnectVKRequest
    responses:
      '201':
        description: Integration created.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Integration
      '400':
        description: |
          Validation failure, unresolvable community, invalid token,
          or `wall` scope missing.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '502':
        description: Upstream VK error.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/vk/{integrationId}/refresh-name:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  - $ref: ../openapi.yaml#/components/parameters/IntegrationIDPath
  post:
    operationId: refreshVKCommunityName
    summary: Backfill the VK community display name in metadata.
    tags:
    - integrations
    responses:
      '200':
        description: Integration row (possibly updated).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Integration
      '400':
        description: Invalid integration ID.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Integration not found in this business.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/telegram/verify:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: verifyTelegramLogin
    summary: Verify a Telegram Login Widget callback (HMAC-SHA256).
    tags:
    - integrations
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/TelegramLoginRequest
    responses:
      '200':
        description: HMAC verified; user payload echoed back.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/TelegramLoginVerifiedResponse
      '400':
        description: Missing hash or malformed body.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '401':
        description: Invalid HMAC or auth_date expired.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/telegram/connect:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: connectTelegram
    summary: Store a Telegram channel integration using the system bot token.
    description: Classified Telegram failures include a stable reason and localized error message.
    tags:
    - integrations
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ConnectTelegramRequest
    responses:
      '201':
        description: Integration created.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Integration
      '400':
        description: Missing channel_id or bot does not have access.
        content:
          application/json:
            schema:
              anyOf:
              - $ref: ../openapi.yaml#/components/schemas/TelegramConnectError
              - $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              anyOf:
              - $ref: ../openapi.yaml#/components/schemas/TelegramConnectError
              - $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '409':
        description: Bot lacks administrator or posting rights, or channel is already connected.
        content:
          application/json:
            schema:
              anyOf:
              - $ref: ../openapi.yaml#/components/schemas/TelegramConnectError
              - $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '429':
        description: Telegram rate limit; reason is rate_limited.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/TelegramConnectError
      '502':
        description: Telegram transport failure; reason is unreachable.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/TelegramConnectError
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/telegram/refresh:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: refreshTelegramLinkedGroup
    summary: Re-probe a Telegram channel's linked discussion group.
    tags:
    - integrations
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/RefreshTelegramRequest
    responses:
      '200':
        description: Updated linked-group probe.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/RefreshTelegramResponse
      '400':
        description: Missing channel_id or malformed body.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Integration not found in this business.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '502':
        description: Bot no longer has access to the channel.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/telegram/owner-link:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: startTelegramOwnerLink
    summary: >-
      Mint a one-time Telegram deep link that binds the verified owner user id
      via a /start handshake.
    tags:
    - integrations
    responses:
      '200':
        description: One-time deep link minted.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/TelegramOwnerLinkResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Owner-link handshake is not configured.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
