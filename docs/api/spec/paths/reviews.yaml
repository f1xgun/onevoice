/reviews/refresh:
  post:
    operationId: refreshReviews
    summary: Cross-business on-demand review pull.
    tags:
    - reviews
    responses:
      '200':
        description: Refresh dispatched.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/StatusOkResponse
      '401':
        description: Missing or invalid access token.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Caller has no business.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/reviews:
  get:
    operationId: listReviews
    tags:
    - reviews
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: platform
      in: query
      required: false
      schema:
        type: string
    - name: reply_status
      in: query
      required: false
      schema:
        type: string
        enum:
        - pending
        - replied
        - error
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 20
        maximum: 100
    - name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    responses:
      '200':
        description: Reviews list + total.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ReviewListResponse
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/reviews/sla:
  get:
    operationId: getReviewSLA
    summary: Aggregate-only response-SLA metrics for a business's reviews.
    description: >-
      Returns counts, unanswered-age buckets, and response-time metrics
      (median / average created_at → replied_at) plus the share answered within
      a target window. Aggregate-only: no author, review text, or reply text is
      read or returned.
    tags:
    - reviews
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: target_hours
      in: query
      required: false
      description: >-
        Answered-within-target window in hours (default 24). Values <= 0 fall
        back to the default.
      schema:
        type: integer
        default: 24
        minimum: 1
    responses:
      '200':
        description: Aggregate SLA metrics.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ReviewSLAResponse
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/reviews/{reviewID}:
  get:
    operationId: getReview
    tags:
    - reviews
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: reviewID
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Review row.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Review
      '403':
        description: Missing `content:read` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Review or business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/reviews/{reviewID}/reply/retry:
  post:
    operationId: retryReviewReply
    summary: Re-send the stored reply of a review whose previous send failed.
    description: >-
      No request body: the failed reply attempt already persisted its text with
      the `error` reply status, so the retry re-dispatches that stored text
      verbatim. Only a review in the `error` reply state is retryable; the
      dispatch reuses the original idempotency key, so a reply that actually
      reached the platform is answered from the agent's dedupe cache instead of
      being posted a second time.
    tags:
    - reviews
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: reviewID
      in: path
      required: true
      schema:
        type: string
    responses:
      '200':
        description: Retry dispatched and outcome persisted.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/StatusOkResponse
      '403':
        description: Missing `content:update` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Review or business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '409':
        description: >-
          Review is not in the `error` reply state (`reply_not_retryable`) —
          a delivered or still-pending reply is never re-sent.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CodeErrorResponse
/businesses/{id}/reviews/{reviewID}/reply:
  put:
    operationId: replyToReview
    tags:
    - reviews
    parameters:
    - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
    - name: reviewID
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ReplyToReviewRequest
    responses:
      '200':
        description: Reply persisted.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/StatusOkResponse
      '400':
        description: Invalid body / validation failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Missing `content:update` permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Review or business not found.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
