/waitlist:
  post:
    operationId: joinWaitlist
    summary: Join the closed-beta waitlist.
    description: |
      Public, unauthenticated. Records a marketing-landing visitor's interest
      in the closed beta. Deduplicated by email; the response never reveals
      whether the email was already present. Repeated signups update supplied
      source and plan; omitted fields preserve existing attribution.
    tags:
    - landing
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/WaitlistRequest
    responses:
      '204':
        description: Signup recorded (or already present — indistinguishable).
      '400':
        description: Invalid email, unknown enum value, or consent not given.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '429':
        description: Too many requests from this IP.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/channel-votes:
  post:
    operationId: recordChannelVote
    summary: Cast a fake-door vote for a not-yet-supported channel.
    description: |
      Public, unauthenticated. Records anonymous demand for a channel OneVoice
      does not support yet, from the marketing landing.
    tags:
    - landing
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/PublicChannelVoteRequest
    responses:
      '204':
        description: Vote recorded.
      '400':
        description: Unknown channel or note too long.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '429':
        description: Too many requests from this IP.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/landing-events:
  post:
    operationId: recordLandingEvent
    summary: Record an anonymous landing CTA click.
    description: Body is limited to 4096 bytes. Path is limited to 1024 bytes and is never a metric label.
    tags: [landing]
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LandingEventRequest
    responses:
      '204':
        description: Click persisted and counted.
      '400':
        description: Invalid CTA, pathname, JSON, or oversized body.
      '429':
        description: Too many requests from this IP.
      '500':
        description: Persistence failed.
