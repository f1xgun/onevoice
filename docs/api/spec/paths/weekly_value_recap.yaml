/businesses/{id}/recap/latest:
  get:
    summary: Get the prior completed UTC week's value recap
    description: Returns aggregate completed-operation counts only. A missing or suppressed week returns 204.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Eligible recap for the exact prior Monday-to-Monday UTC week.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WeeklyValueRecap
      '204':
        description: No eligible recap for the prior completed week.
      '403':
        description: Missing content read permission.
