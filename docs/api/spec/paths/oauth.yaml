        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '404':
        description: Integration not found in this business.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '503':
        description: Agent task publisher not configured.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/oauth/vk/callback:
  get:
    operationId: vkOAuthCallback
    summary: Handle the classic VK OAuth callback (step 1 — user token).
    tags:
    - oauth
    security: []
    parameters:
    - in: query
      name: code
      required: true
      schema:
        type: string
    - in: query
      name: state
      required: true
      schema:
        type: string
    responses:
      '302':
        description: Redirect to the frontend (`/integrations?...`).
/oauth/vk/community-callback:
  get:
    operationId: vkCommunityOAuthCallback
    summary: Handle the VK community OAuth callback (step 2 — community token).
