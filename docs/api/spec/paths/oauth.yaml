/businesses/{id}/integrations/vk/auth-url:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  get:
    operationId: getVKAuthURL
    summary: Build the VK OAuth2 authorization URL (step 1 — user token).
    tags:
    - oauth
    responses:
      '200':
        description: Authorization URL the frontend should redirect to.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AuthURLResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/vk/communities:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  get:
    operationId: listVKCommunities
    summary: List VK communities where the temp-stored user is admin.
    tags:
    - oauth
    responses:
      '200':
        description: Community rows.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../openapi.yaml#/components/schemas/VKCommunity
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '410':
        description: Temp token expired (VK session expired, reconnect).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '502':
        description: Upstream VK error.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/vk/community-auth-url:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  - in: query
    name: group_id
    required: true
    schema:
      type: string
    description: |
      Numeric VK group_id, screen_name, or full VK URL. Resolved
      server-side to a numeric id before the OAuth URL is built.
  get:
    operationId: getVKCommunityAuthURL
    summary: Build the VK community OAuth2 URL (step 2 — community token).
    tags:
    - oauth
    responses:
      '200':
        description: Authorization URL the frontend should redirect to.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/AuthURLResponse
      '400':
        description: Missing or unresolvable group_id.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
