/businesses/{id}/integrations/google_business/select-location:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: selectGoogleLocation
    summary: Persist the user's chosen Google Business location as an integration.
    tags:
    - oauth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/GoogleSelectLocationRequest
    responses:
      '201':
        description: Integration created.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Integration
      '400':
        description: Validation failure or location not in the discovered set.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '410':
        description: Temp data expired.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
/businesses/{id}/integrations/yandex_business/probe:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  post:
    operationId: probeYandexBusiness
    summary: Validate pasted Yandex cookies without persisting.
    tags:
    - oauth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/YandexCookiesRequest
