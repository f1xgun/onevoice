/businesses/{id}/integrations/google_business/locations:
  parameters:
  - $ref: ../openapi.yaml#/components/parameters/BusinessIDPath
  get:
    operationId: listGoogleLocations
    summary: Return Google Business locations stashed during the OAuth callback.
    tags:
    - oauth
    responses:
      '200':
        description: Discovered location list.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/GoogleLocationsResponse
      '403':
        description: Insufficient permission.
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '410':
        description: Temp data expired (Google session expired, reconnect).
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ErrorResponse
      '500':
        description: Internal failure.
        content:
          application/json:
            schema:
