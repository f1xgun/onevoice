components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Access-token cookie set by /auth/login. The orchestrator delegates
        cookie validation to services/api's chat_proxy facade, so this
        scheme also documents the public contract for orchestrator
        endpoints reached through that proxy.
    mtls:
      type: mutualTLS
      description: |
        Cluster-only mutual TLS. The public reverse proxy MUST drop any
        request matching an mTLS-protected prefix (/internal/*, /tokens,
        /billing/*) — application-level checks supplement the network
        boundary but do not replace it.
  parameters:
    BusinessIDPath:
      name: id
      in: path
      required: true
      description: Business UUID. Non-members receive 404 (not 403).
      schema:
        type: string
        format: uuid
    IntegrationIDPath:
      name: integrationId
      in: path
      required: true
      description: Integration UUID.
      schema:
        type: string
        format: uuid
    UserIDPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleIDPath:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationTokenPath:
      name: token
      in: path
      required: true
      description: Raw single-use invitation token. Server hashes before lookup.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessNotFound:
      description: Business not found or caller is not a member (masked).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal failure (`internal_server_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodeErrorResponse'
  schemas:
    ErrorResponse:
      description: Plain-text error envelope; emitted by writeJSONError.
      type: object
      required:
      - error
      properties:
        error:
          type: string
    CodeErrorResponse:
      description: |
        Machine-routable error envelope; emitted by writeJSONCodeError.
        Frontend resolves `code` to a localized message via i18n catalog.
      type: object
      required:
      - code
      properties:
        code:
          type: string
    BillingErrorResponse:
      description: |
        Error envelope used by the internal billing endpoints. `error`
        values map to pkg/billingclient sentinels.
      type: object
      required:
      - error
      properties:
        error:
          type: string
        detail:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginResponse:
      type: object
      required:
      - user
      - accessToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
    RefreshTokenResponse:
      type: object
      required:
      - user
      - accessToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
    MeResponse:
      description: |
        Flattened user payload plus verification banner, deletion grace,
        and reconsent fields.
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        required:
        - emailVerified
        properties:
          emailVerified:
            type: boolean
          emailVerificationDeadline:
            type: string
            format: date-time
            nullable: true
          accountDeletion:
            $ref: '#/components/schemas/AccountDeletionInfo'
          requiresReconsent:
            $ref: '#/components/schemas/RequiresReconsentInfo'
    AccountDeletionInfo:
      type: object
      nullable: true
      required:
      - requestedAt
      - scheduledDeletionAt
      - canRestoreUntil
      properties:
        requestedAt:
          type: string
          format: date-time
        scheduledDeletionAt:
          type: string
          format: date-time
        canRestoreUntil:
          type: string
          format: date-time
    RequiresReconsentInfo:
      type: object
      nullable: true
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            type: object
            required:
            - slug
            - currentVersion
            properties:
              slug:
                type: string
              currentVersion:
                type: string
              acceptedVersion:
                type: string
                nullable: true
    User:
      type: object
      required:
      - id
      - email
      - preferred_locale
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        preferred_locale:
          type: string
          enum:
          - ru
          - en
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - consents
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        consents:
          $ref: '#/components/schemas/RegisterConsents'
    RegisterConsents:
      type: object
      required:
      - tos
      - privacy
      - pdn
      properties:
        tos:
          type: string
        privacy:
          type: string
        pdn:
          type: string
    RequestPasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ConfirmPasswordResetRequest:
      type: object
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
    VerifyConfirmRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          minLength: 20
    EmailBeforeVerifyRequest:
      type: object
      required:
      - newEmail
      properties:
        newEmail:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    UpdatePreferredLocaleRequest:
      type: object
      required:
      - locale
      properties:
        locale:
          type: string
          enum:
          - ru
          - en
    StatusOKResponse:
      description: |
        `{status:"ok"}` envelope used by ChangePassword. Distinct from
        `StatusOkResponse` (camelCase variant) used by review reply and
        review-refresh handlers.
      type: object
      required:
      - status
      properties:
        status:
          type: string
    StatusOkResponse:
      description: |
        `{status:"ok"}` envelope used by reviewReply and refreshReviews.
        Enum-pinned variant of `StatusOKResponse`.
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    ConsentRequiredResponse:
      type: object
      required:
      - code
      - missing
      properties:
        code:
          type: string
          enum:
          - consent_required
        missing:
          type: array
          items:
            type: string
    ReconsentRequest:
      type: object
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/ReconsentPolicy'
    ReconsentPolicy:
      type: object
      required:
      - slug
      - version
      properties:
        slug:
          type: string
        version:
          type: string
        sha256:
          type: string
    VersionMismatchResponse:
      type: object
      required:
      - code
      - currentVersion
      properties:
        code:
          type: string
          enum:
          - version_mismatch
        currentVersion:
          type: string
    ListConsentsResponse:
      type: object
      required:
      - consents
      properties:
        consents:
          type: array
          items:
            $ref: '#/components/schemas/ConsentRecord'
    ConsentRecord:
      type: object
      required:
      - slug
      - version
      - acceptedAt
      properties:
        slug:
          type: string
        version:
          type: string
        sha256:
          type: string
        acceptedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
    DeleteAccountRequest:
      type: object
      required:
      - password
      properties:
        password:
          type: string
          minLength: 1
    SoleOwnerResponse:
      type: object
      required:
      - code
      - businesses
      properties:
        code:
          type: string
          enum:
          - sole_owner_of_businesses
        businesses:
          type: array
          items:
            $ref: '#/components/schemas/SoleOwnerBusinessEntry'
    SoleOwnerBusinessEntry:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PendingDeletionResponse:
      type: object
      required:
      - code
      - deletionDate
      - restoreUrl
      properties:
        code:
          type: string
          enum:
          - account_pending_deletion
        deletionDate:
          type: string
        restoreUrl:
          type: string
    Platform:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/PlatformStatus'
    PlatformStatus:
      type: string
      enum:
      - active
      - coming_soon
      - oauth_not_configured
    Business:
      type: object
      required:
      - id
      - name
      - settings
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        address:
          type: string
        phone:
          type: string
        website:
          type: string
          nullable: true
        description:
          type: string
        logoUrl:
          type: string
        settings:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BusinessMembershipSummary:
      type: object
      required:
      - id
      - name
      - role
      - status
      - joined_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/BusinessMembershipRoleRef'
        status:
          type: string
        joined_at:
          type: string
          format: date-time
    BusinessMembershipRoleRef:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    CreateBusinessRequest:
      type: object
