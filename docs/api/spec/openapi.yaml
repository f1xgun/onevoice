        content:
          type: string
    ResumeRequest:
      type: object
      properties:
        business_approvals:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ToolFloor'
        project_approval_overrides:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ToolFloor'
        active_integrations:
          type: array
          items:
            type: string
        whitelist_mode:
          type: string
          enum:
          - inherit
          - all
          - explicit
          - none
          - ''
        allowed_tools:
          type: array
          items:
            type: string
        model:
          type: string
        tier:
          type: string
    DraftReplyRequest:
      type: object
      required:
      - reviewText
      - businessId
      - platform
      - rating
      properties:
        businessId:
          type: string
        businessName:
          type: string
        businessCategory:
          type: string
        businessDescription:
          type: string
        platform:
          type: string
        reviewText:
          type: string
        rating:
          type: integer
          minimum: 0
          maximum: 5
        authorName:
          type: string
        examples:
          type: array
          items:
            $ref: '#/components/schemas/DraftReplyExample'
    DraftReplyExample:
      type: object
      required:
      - reviewText
      - replyText
      properties:
        reviewText:
          type: string
        replyText:
          type: string
        rating:
          type: integer
          minimum: 0
          maximum: 5
    DraftReplyResponse:
      type: object
      required:
      - draftReply
      properties:
        draftReply:
          type: string
        provider:
          type: string
        model:
          type: string
    ToolNamesResponse:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          items:
            type: string
    ToolRegistryEntry:
      description: |
        Orchestrator's internal tool registry projection. The `floor` may
        carry `forbidden` (in addition to `auto` / `manual`); the api side
        uses `ToolEntry` (auto/manual only).
      type: object
      required:
      - name
      - displayName
      - platform
      - floor
      - editableFields
      - description
      - userDescription
      properties:
        name:
          type: string
        displayName:
          type: string
        displayNameKey:
          type: string
        platform:
          type: string
        floor:
          $ref: '#/components/schemas/ToolFloor'
        editableFields:
          type: array
          items:
            type: string
        description:
          type: string
        userDescription:
          type: string
    SSEEvent:
      description: |
        Discriminated union over the per-type SSE event schemas. `type`
        is the discriminator. Wire envelope is `data: <json>\n\n`.
      oneOf:
      - $ref: '#/components/schemas/SSEEventText'
      - $ref: '#/components/schemas/SSEEventToolCall'
      - $ref: '#/components/schemas/SSEEventToolResult'
      - $ref: '#/components/schemas/SSEEventToolRejected'
      - $ref: '#/components/schemas/SSEEventApprovalRequired'
      - $ref: '#/components/schemas/SSEEventDone'
      - $ref: '#/components/schemas/SSEEventError'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/SSEEventText'
          tool_call: '#/components/schemas/SSEEventToolCall'
          tool_result: '#/components/schemas/SSEEventToolResult'
          tool_rejected: '#/components/schemas/SSEEventToolRejected'
          tool_approval_required: '#/components/schemas/SSEEventApprovalRequired'
          done: '#/components/schemas/SSEEventDone'
          error: '#/components/schemas/SSEEventError'
    SSEEventText:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - text
        content:
          type: string
    SSEEventToolCall:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - tool_call
        tool_call_id:
          type: string
        tool_name:
          type: string
        tool_display_name:
          type: string
        tool_display_name_key:
          type: string
        tool_args:
          type: object
          additionalProperties: true
    SSEEventToolResult:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - tool_result
        tool_call_id:
          type: string
        tool_name:
          type: string
        tool_display_name:
          type: string
        tool_display_name_key:
          type: string
        result:
          description: Tool reply payload (any JSON).
          nullable: true
        error:
          type: string
    SSEEventToolRejected:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - tool_rejected
        tool_call_id:
          type: string
        tool_name:
          type: string
        tool_display_name:
          type: string
        tool_display_name_key:
          type: string
        error:
          type: string
    SSEEventApprovalRequired:
      type: object
      required:
      - type
      - batch_id
      - calls
      properties:
        type:
          type: string
          enum:
          - tool_approval_required
        batch_id:
          type: string
        calls:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCall'
    SSEEventDone:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - done
        content:
          type: string
    SSEEventError:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - error
        code:
          type: string
        content:
          type: string
    ApprovalCall:
      type: object
      required:
      - call_id
      - tool_name
      - args
      - editable_fields
      - floor
      properties:
        call_id:
          type: string
        tool_name:
          type: string
        args:
          type: object
          additionalProperties: true
        editable_fields:
          type: array
          items:
            type: string
        floor:
          $ref: '#/components/schemas/ToolFloor'
    ChannelRequestChannel:
      type: string
      description: |
        A not-yet-supported channel a business is expressing demand for.
        Backs a fake-door affordance so pull is measured before the channel
        is built.
      enum:
      - avito
      - wildberries
      - ozon
      - 2gis
      - other
    CreateChannelRequestRequest:
      type: object
      required:
      - channel
      properties:
        channel:
          type: string
          description: |
            A not-yet-supported channel a business is expressing demand for.
          enum:
          - avito
          - wildberries
          - ozon
          - 2gis
          - other
        note:
          type: string
          maxLength: 280
    ChannelDemandCount:
      type: object
      required:
      - channel
      - count
      properties:
        channel:
          $ref: '#/components/schemas/ChannelRequestChannel'
        count:
          type: integer
    ChannelDemandSummary:
      type: object
      required:
      - channels
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelDemandCount'
    LandingEventRequest:
      type: object
      required: [cta, path]
      properties:
        cta:
          type: string
          enum: [hero-waitlist, hero-register, nav-register, nav-login, pricing-free-register, pricing-pro-waitlist, waitlist-success-register]
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: Local pathname starting with a single slash, without query or fragment.
    TelegramConnectError:
      type: object
      required: [error, reason]
      properties:
        error:
          type: string
        reason:
          type: string
          description: Stable Telegram connection failure reason.
    WaitlistRequest:
      type: object
      description: |
        Public closed-beta waitlist signup submitted from the marketing
        landing. Only email and the processing-consent flag are required; the
        segmentation fields are optional. Enums are inlined (not $ref) so the
        generated struct carries validate:oneof tags.
      required:
      - email
      - consent
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        sphere:
          type: string
          description: Optional organization-sphere segment.
          enum:
          - cafe
          - beauty
          - services
          - retail
          - other
        pain:
          type: string
          description: Optional strongest-pain segment.
          enum:
          - reviews
          - posts
          - card
        source:
          type: string
          enum: [landing, billing, business-limit]
          description: Optional latest signup source; omitted values preserve existing attribution.
        plan:
          type: string
          enum: [pro]
          description: Optional requested plan; omitted values preserve existing interest.
        consent:
          type: boolean
          description: |
            Must be true — the visitor ticked the personal-data-processing
            consent checkbox. A false or absent value fails validation.
    PublicChannelVoteRequest:
      type: object
      description: |
        Public fake-door vote for a not-yet-supported channel, cast from the
        marketing landing by an unauthenticated visitor. Measures anonymous
        top-of-funnel demand; distinct from the business-scoped
        CreateChannelRequestRequest.
      required:
      - channel
      properties:
        channel:
          type: string
          enum:
          - whatsapp
          - avito
          - 2gis
          - other
        note:
          type: string
          maxLength: 280
