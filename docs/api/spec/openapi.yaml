components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        Access-token cookie set by /auth/login. The orchestrator delegates
        cookie validation to services/api's chat_proxy facade, so this
        scheme also documents the public contract for orchestrator
        endpoints reached through that proxy.
    mtls:
      type: mutualTLS
      description: |
        Cluster-only mutual TLS. The public reverse proxy MUST drop any
        request matching an mTLS-protected prefix (/internal/*, /tokens,
        /billing/*) — application-level checks supplement the network
        boundary but do not replace it.
  parameters:
    BusinessIDPath:
      name: id
      in: path
      required: true
      description: Business UUID. Non-members receive 404 (not 403).
      schema:
        type: string
        format: uuid
    IntegrationIDPath:
      name: integrationId
      in: path
      required: true
      description: Integration UUID.
      schema:
        type: string
        format: uuid
    UserIDPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleIDPath:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationTokenPath:
      name: token
      in: path
      required: true
      description: Raw single-use invitation token. Server hashes before lookup.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or expired access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BusinessNotFound:
      description: Business not found or caller is not a member (masked).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal failure (`internal_server_error`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodeErrorResponse'
  schemas:
    ErrorResponse:
      description: Plain-text error envelope; emitted by writeJSONError.
      type: object
      required:
      - error
      properties:
        error:
          type: string
    CodeErrorResponse:
      description: |
        Machine-routable error envelope; emitted by writeJSONCodeError.
        Frontend resolves `code` to a localized message via i18n catalog.
      type: object
      required:
      - code
      properties:
        code:
          type: string
    BillingErrorResponse:
      description: |
        Error envelope used by the internal billing endpoints. `error`
        values map to pkg/billingclient sentinels.
      type: object
      required:
      - error
      properties:
        error:
          type: string
        detail:
          type: string
    ValidationErrorResponse:
      description: |
        Field-level validation error envelope; emitted by writeValidationError.
        `error` carries a localized summary; `fields` maps field name to
        localized per-field message keyed by validator/v10 tag.
      type: object
      required:
      - error
      - fields
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    PasswordResetErrorResponse:
      description: |
        Discriminated error envelope emitted by writePasswordResetError.
        `code` is one of `reset_token_invalid` / `reset_token_expired` /
        `password_too_weak`; `message` is a server-localized RU string the
        frontend renders as-is when no i18n catalog entry matches.
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
    InvitationStateErrorResponse:
      description: |
        410-gone envelope emitted by writeInvitationStateError. `error`
        is always the literal "gone"; `reason` discriminates the cause
        (`expired` / `revoked` / `accepted` / `unknown`) for the
        frontend refusal matrix. `unknown` is the safe default for
        ErrInvitationNotFound — uniform 410 defends against token
        existence enumeration.
      type: object
      required:
      - error
      properties:
        error:
          type: string
        reason:
          type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginResponse:
      type: object
      required:
      - user
      - accessToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
    RefreshTokenResponse:
      type: object
      required:
      - user
      - accessToken
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
    MeResponse:
      description: |
        Flattened user payload plus verification banner, deletion grace,
        and reconsent fields.
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        required:
        - emailVerified
        properties:
          emailVerified:
            type: boolean
          emailVerificationDeadline:
            type: string
            format: date-time
          accountDeletion:
            $ref: '#/components/schemas/AccountDeletionInfo'
          requiresReconsent:
            $ref: '#/components/schemas/RequiresReconsentInfo'
    AccountDeletionInfo:
      type: object
      required:
      - requestedAt
      - scheduledDeletionAt
      - canRestoreUntil
      properties:
        requestedAt:
          type: string
          format: date-time
        scheduledDeletionAt:
          type: string
          format: date-time
        canRestoreUntil:
          type: string
          format: date-time
    RequiresReconsentInfo:
      type: object
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            type: object
            required:
            - slug
            - oldVersion
            - newVersion
            - sha256
            properties:
              slug:
                type: string
              oldVersion:
                type: string
              newVersion:
                type: string
              sha256:
                type: string
    User:
      type: object
      required:
      - id
      - email
      - name
      - preferred_locale
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        preferred_locale:
          type: string
          enum:
          - ru
          - en
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - name
      - consents
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 2
          maxLength: 100
        consents:
          $ref: '#/components/schemas/RegisterConsents'
    RegisterConsents:
      type: object
      description: |
        Per-slug version map submitted with /auth/register. The handler enforces
        version-equality (vs `legalconfig.*Version`) and returns 400
        consent_required listing the missing slugs, so individual fields are
        NOT marked `required` at the schema level — a missing field is treated
        as a stale consent, not a schema violation.
      properties:
        tos:
          type: string
        privacy:
          type: string
        pdn:
          type: string
    RequestPasswordResetRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ConfirmPasswordResetRequest:
      type: object
      required:
      - token
      - newPassword
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
    VerifyConfirmRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
          minLength: 20
    EmailBeforeVerifyRequest:
      type: object
      required:
      - newEmail
      properties:
        newEmail:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
    UpdatePreferredLocaleRequest:
      type: object
      required:
      - locale
      properties:
        locale:
          type: string
          enum:
          - ru
          - en
    UpdateProfileRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
    StatusOKResponse:
      description: |
        `{status:"ok"}` envelope used by ChangePassword. Distinct from
        `StatusOkResponse` (camelCase variant) used by review reply and
        review-refresh handlers.
      type: object
      required:
      - status
      properties:
        status:
          type: string
    StatusOkResponse:
      description: |
        `{status:"ok"}` envelope used by reviewReply and refreshReviews.
