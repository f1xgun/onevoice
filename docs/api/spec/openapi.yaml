    SSEEvent:
      description: |
        Discriminated union over the per-type SSE event schemas. `type`
        is the discriminator. Wire envelope is `data: <json>\n\n`.
      oneOf:
      - $ref: '#/components/schemas/SSEEventText'
      - $ref: '#/components/schemas/SSEEventToolCall'
      - $ref: '#/components/schemas/SSEEventToolResult'
      - $ref: '#/components/schemas/SSEEventToolRejected'
      - $ref: '#/components/schemas/SSEEventApprovalRequired'
      - $ref: '#/components/schemas/SSEEventDone'
      - $ref: '#/components/schemas/SSEEventError'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/SSEEventText'
          tool_call: '#/components/schemas/SSEEventToolCall'
          tool_result: '#/components/schemas/SSEEventToolResult'
          tool_rejected: '#/components/schemas/SSEEventToolRejected'
          tool_approval_required: '#/components/schemas/SSEEventApprovalRequired'
          done: '#/components/schemas/SSEEventDone'
          error: '#/components/schemas/SSEEventError'
    SSEEventText:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - text
        content:
          type: string
    SSEEventToolCall:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - tool_call
        tool_call_id:
          type: string
        tool_name:
          type: string
        tool_display_name:
          type: string
        tool_display_name_key:
          type: string
        tool_args:
          type: object
          additionalProperties: true
    SSEEventToolResult:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - tool_result
        tool_call_id:
          type: string
        tool_name:
          type: string
        tool_display_name:
          type: string
        tool_display_name_key:
          type: string
        result:
          description: Tool reply payload (any JSON).
          nullable: true
        error:
          type: string
    SSEEventToolRejected:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - tool_rejected
        tool_call_id:
          type: string
        tool_name:
          type: string
        tool_display_name:
          type: string
        tool_display_name_key:
          type: string
        error:
          type: string
    SSEEventApprovalRequired:
      type: object
      required:
      - type
      - batch_id
      - calls
      properties:
        type:
          type: string
          enum:
          - tool_approval_required
        batch_id:
          type: string
        calls:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalCall'
    SSEEventDone:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - done
        content:
          type: string
    SSEEventError:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - error
        code:
          type: string
        content:
          type: string
    ApprovalCall:
      type: object
      required:
      - call_id
      - tool_name
      - args
      - editable_fields
      - floor
      properties:
        call_id:
          type: string
        tool_name:
          type: string
        args:
          type: object
          additionalProperties: true
        editable_fields:
          type: array
          items:
            type: string
        floor:
          $ref: '#/components/schemas/ToolFloor'
