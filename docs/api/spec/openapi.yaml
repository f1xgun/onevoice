            true when the business never set a preference.
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday the brief fires on (0=Sunday .. 6=Saturday).
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour-of-day (0-23) the brief fires at.
