      properties:
        voiceProfile:
          type: string
          description: Stored brand-voice profile; empty string when unset.
    UpdateReviewAutopilotRequest:
      type: object
      required:
      - minRating
      properties:
        enabled:
          type: boolean
          description: |
            Opt-in switch for the review-reply autopilot. When true, a positive
            drafted reply on a direct-API platform (Telegram/VK) is auto-published;
            Yandex.Business, negative, and needs_review replies always stay pending
            for manual approval. Absent is treated as false (disabled).
        minRating:
          type: integer
          minimum: 4
          maximum: 5
          description: |
            The minimum star rating that may be auto-published. Bounded to the
            positive range so the floor can only be raised (e.g. 5-star-only) and
            can never be lowered to auto-publish a negative or neutral review.
    ReviewAutopilotResponse:
      type: object
      required:
      - enabled
      - minRating
      properties:
        enabled:
          type: boolean
          description: Whether the review-reply autopilot is enabled (default false).
        minRating:
          type: integer
          description: |
            The minimum star rating that may be auto-published (default 4 when
            unset; always at least 4).
