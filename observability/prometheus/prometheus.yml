global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8090"]
    metrics_path: /metrics

  - job_name: pushgateway
    # honor_labels: true so backup_* metrics keep the job/instance labels
    # the producer set (e.g. job=onevoice_backup). Without this scrape
    # job, backup_last_success_timestamp never reaches Prometheus and the
    # D-05 alerting rule cannot fire (plan-checker W-5).
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
