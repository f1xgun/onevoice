groups:
  - name: backup
    rules:
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp > 26*3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup in 26h"
          description: "Backup cron has not reported success in over 26h. Restore-from-backup procedure: docs/runbook-restore.md."
