groups:
  - name: llm
    rules:
      - alert: LLMProviderHighErrorRate
        expr: |
          sum by (provider) (rate(llm_requests_total{status="error"}[5m]))
            /
          sum by (provider) (rate(llm_requests_total[5m]))
            > 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "LLM provider {{ $labels.provider }} error rate > 10%"
          description: "Provider {{ $labels.provider }} error rate exceeded 10% for 5m. See docs/runbook/observability.md."
