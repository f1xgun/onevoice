services:
  # PostgreSQL
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: onevoice-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, generate with openssl rand -base64 24}
      POSTGRES_DB: onevoice
    # Not published beyond loopback: clients reach it on postgres:5432 inside
    # onevoice-network; the 127.0.0.1 host mapping lets host-run binaries dial it
    # without exposing the port on the VM's public IP. docker-compose.prod.yml
    # drops even the loopback mapping via `ports: !reset []`.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network

  # MongoDB — access control enabled (mongod --auth). The root user is created
  # on first boot from MONGO_ROOT_USERNAME/PASSWORD; api and orchestrator
  # authenticate with the same credentials embedded in MONGO_URI
  # (authSource=admin). Not published beyond loopback: clients reach it on
  # mongodb:27017 inside onevoice-network, and the 127.0.0.1 host mapping keeps
  # host-run binaries able to dial it without exposing an unauthenticated-by-
  # default port on the VM's public IP. docker-compose.prod.yml drops even the
  # loopback mapping via `ports: !reset []`. The `ping` healthcheck needs no
  # credentials (it is exempt from auth).
  mongodb:
    restart: unless-stopped
    image: mongo:7
    container_name: onevoice-mongodb
    command: ["mongod", "--auth", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: onevoice
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set (MongoDB auth); see .env.example}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set, generate with openssl rand -hex 24}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./migrations/mongo:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network

  # Redis — password-protected (requirepass). Not published beyond loopback;
  # clients reach it on redis:6379 inside onevoice-network. REDISCLI_AUTH lets
  # the healthcheck's redis-cli authenticate without embedding the password in
  # the command line. docker-compose.prod.yml drops the loopback mapping.
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: onevoice-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network

  # NATS — authenticated (see infra/nats/nats-server.conf). Not published to the
  # host beyond loopback: clients reach it on nats:4222 inside onevoice-network.
  # The dev loopback binding (127.0.0.1) keeps host-run binaries able to dial it
  # without exposing an unauthenticated-by-default port on the VM's public IP;
  # docker-compose.prod.yml drops even the loopback mapping via `ports: !reset []`.
  nats:
    restart: unless-stopped
    image: nats:2.10-alpine
    container_name: onevoice-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    # Auth is per-service nkey (creds/auth.conf) + server TLS (nats.crt). No
    # shared password env — run `make nats-creds` and `make mtls-certs` before
    # `docker compose up` to populate the mounted material.
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
      - ./infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      # Generated per-service nkey user table (public keys + subject ACLs). The
      # server needs only auth.conf, not the seeds — mount the single file.
      - ./infra/nats/creds/auth.conf:/etc/nats/creds/auth.conf:ro
      # NATS server TLS cert + key (rides the shared dev CA under infra/mtls).
      - ./infra/mtls/certs:/etc/nats/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network

  # MinIO — S3-compatible object storage for user uploads (logos, etc.)
  minio:
    restart: unless-stopped
    image: minio/minio:latest
    container_name: onevoice-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set, generate with openssl rand -base64 24}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set, generate with openssl rand -base64 24}
    # Not published beyond loopback: clients reach it on minio:9000 inside
    # onevoice-network; the 127.0.0.1 host mappings keep the S3 API (9000) and
    # console (9001) reachable for host-run dev without exposing them on the VM's
    # public IP. docker-compose.prod.yml drops even the loopback mappings.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network

  # Create the bucket and grant anonymous GetObject on its objects.
  #
  # NOT `mc anonymous set download`: that shorthand also grants bucket-level
  # s3:ListBucket, so an unauthenticated caller could enumerate every object key
  # (logo and generated-image paths carry business UUIDs) through the public
  # /media/ edge. The explicit policy below allows reads of known keys only.
  minio-init:
    image: minio/mc:latest
    container_name: onevoice-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MC_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MC_BUCKET: ${S3_BUCKET:-onevoice}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASSWORD"
        mc mb --ignore-existing "local/$$MC_BUCKET"
        cat > /tmp/anonymous-read.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::$$MC_BUCKET/*"]
            }
          ]
        }
        JSON
        mc anonymous set-json /tmp/anonymous-read.json "local/$$MC_BUCKET"
        echo 'MinIO bucket ready'
    networks:
      - onevoice-network

  # Migration runner
  migrate:
    image: migrate/migrate:latest
    container_name: onevoice-migrate
    volumes:
      - ./migrations/postgres:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, generate with openssl rand -base64 24}@postgres:5432/onevoice?sslmode=disable",
      "up"
    ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onevoice-network

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onevoice-api
    environment:
      # APP_ENV drives every fail-closed production gate in config.Load()
      # (LEGAL_* validation, LLM residency, internal mTLS, orchestrator secret).
      # Without it the api boots as development whatever .env says.
      APP_ENV: ${APP_ENV:-development}
      PORT: 8080
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, generate with openssl rand -base64 24}
      POSTGRES_DB: onevoice
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set (MongoDB auth); see .env.example}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set, generate with openssl rand -hex 24}@mongodb:27017/onevoice?authSource=admin
      MONGO_DB: onevoice
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, generate with openssl rand -base64 48}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set, generate with openssl rand -base64 24}
      # Required shared key that seals secret A2A tool args (Yandex connect
      # cookies) with AES-256-GCM over NATS, so the broker never sees the
      # plaintext cookie. Must be identical on agent-yandex-business.
      A2A_PAYLOAD_KEY: ${A2A_PAYLOAD_KEY:?A2A_PAYLOAD_KEY must be set, EXACTLY 32 bytes (openssl rand -base64 24); identical on api + agent-yandex-business}
      INTERNAL_PORT: 8443
      ONEVOICE_INTERNAL_ACL_JSON: ${ONEVOICE_INTERNAL_ACL_JSON:?ONEVOICE_INTERNAL_ACL_JSON must be set (CN->platforms map for /internal/v1/tokens); see .env.example}
      ORCHESTRATOR_URL: http://orchestrator:8090
      # Shared secret authenticating api→orchestrator calls. MUST match the
      # orchestrator's ORCHESTRATOR_INTERNAL_SECRET; the orchestrator rejects
      # unauthenticated callers so its body-trusting internal inbound cannot be
      # reached (or its tier/identity forged) by anyone routing to :8090.
      ORCHESTRATOR_INTERNAL_SECRET: ${ORCHESTRATOR_INTERNAL_SECRET:?ORCHESTRATOR_INTERNAL_SECRET must be set, generate with openssl rand -base64 32}
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED: /etc/nats/creds/api.nk
      NATS_CA_PATH: /etc/onevoice/mtls/ca.crt
      REVIEW_SYNC_INTERVAL_MINUTES: ${REVIEW_SYNC_INTERVAL_MINUTES:-30}
      # AI review-draft generation (post-sync hook). Disabled by default — set
      # REVIEW_DRAFT_ENABLED=true to start spending on LLM calls. Requires at
      # least one OPENROUTER_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY set
      # so the orchestrator's router can pick a provider.
      REVIEW_DRAFT_ENABLED: ${REVIEW_DRAFT_ENABLED:-false}
      REVIEW_DRAFT_MAX_EXAMPLES: ${REVIEW_DRAFT_MAX_EXAMPLES:-5}
      REVIEW_DRAFT_BATCH_LIMIT: ${REVIEW_DRAFT_BATCH_LIMIT:-10}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-http://localhost/api/v1/oauth/vk/callback}
      VK_SERVICE_KEY: ${VK_SERVICE_KEY:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost/api/v1/oauth/yandex_business/callback}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set, generate with openssl rand -base64 24}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set, generate with openssl rand -base64 24}
      S3_BUCKET: ${S3_BUCKET:-onevoice}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_URL_PREFIX: ${S3_PUBLIC_URL_PREFIX:-/media}
      # Public reverse-proxy origin. Base of the verify-email / password-reset
      # links, and the default CORS/CSRF allow-list entry.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # Allow-list for the handler-level Origin (CSRF) check on the erasure /
      # consent / organisation-lifecycle endpoints. Empty = PUBLIC_URL (plus the
      # Next.js dev origin outside production).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Empty = derived from the PUBLIC_URL scheme (https ⇒ true). A Secure
      # __Host- cookie is dropped by browsers on a plain-http origin.
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      # 152-ФЗ Art. 14 data-controller identity. Validated fail-closed when
      # APP_ENV=production; LEGAL_ENFORCE=strict also refuses placeholders.
      LEGAL_ENTITY_NAME: ${LEGAL_ENTITY_NAME:-}
      LEGAL_INN: ${LEGAL_INN:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_EMAIL_PDN: ${LEGAL_EMAIL_PDN:-}
      LEGAL_ENFORCE: ${LEGAL_ENFORCE:-}
      # Signs the Telegram HITL inline approval callbacks. Must be identical on
      # agent-telegram, or inline approvals are silently disabled.
      TELEGRAM_APPROVAL_HMAC_SECRET: ${TELEGRAM_APPROVAL_HMAC_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      SMARTCAPTCHA_SITE_KEY: ${SMARTCAPTCHA_SITE_KEY:-}
      SMARTCAPTCHA_SECRET_KEY: ${SMARTCAPTCHA_SECRET_KEY:-}
      SMARTCAPTCHA_FAIL_OPEN: ${SMARTCAPTCHA_FAIL_OPEN:-}
      LOCKOUT_FAIL_THRESHOLD_CAPTCHA: ${LOCKOUT_FAIL_THRESHOLD_CAPTCHA:-}
      LOCKOUT_FAIL_THRESHOLD_LOCK: ${LOCKOUT_FAIL_THRESHOLD_LOCK:-}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION:-}
      # Shared representative Yandex ID + the org it manages (delegated access).
      YANDEX_REP_LOGIN: ${YANDEX_REP_LOGIN:-}
      YANDEX_SHARED_BUSINESS_ID: ${YANDEX_SHARED_BUSINESS_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Lifts the production cross-border LLM gate; only with a filed legal basis.
      ALLOW_TRANSBORDER_LLM: ${ALLOW_TRANSBORDER_LLM:-}
      LLM_TIER: ${LLM_TIER:-}
      MESSAGE_HISTORY_LIMIT: ${MESSAGE_HISTORY_LIMIT:-}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-}
      ORCHESTRATOR_FETCH_TIMEOUT: ${ORCHESTRATOR_FETCH_TIMEOUT:-}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-}
      FEEDBACK_NOTIFY_EMAIL: ${FEEDBACK_NOTIFY_EMAIL:-}
      SYNC_RECONCILE_ENABLED: ${SYNC_RECONCILE_ENABLED:-}
      SYNC_RECONCILE_POLL_INTERVAL: ${SYNC_RECONCILE_POLL_INTERVAL:-}
      CREDIT_GRANT_ENABLED: ${CREDIT_GRANT_ENABLED:-}
      CREDIT_GRANT_POLL_INTERVAL: ${CREDIT_GRANT_POLL_INTERVAL:-}
      OWNER_BRIEF_ENABLED: ${OWNER_BRIEF_ENABLED:-}
      OWNER_BRIEF_MODEL: ${OWNER_BRIEF_MODEL:-}
      OWNER_BRIEF_POLL_INTERVAL: ${OWNER_BRIEF_POLL_INTERVAL:-}
      PRESENCE_HEALTH_SNAPSHOT_ENABLED: ${PRESENCE_HEALTH_SNAPSHOT_ENABLED:-}
      PRESENCE_HEALTH_SNAPSHOT_POLL_INTERVAL: ${PRESENCE_HEALTH_SNAPSHOT_POLL_INTERVAL:-}
      CONNECTION_HEALTH_ENABLED: ${CONNECTION_HEALTH_ENABLED:-}
      CONNECTION_HEALTH_POLL_INTERVAL: ${CONNECTION_HEALTH_POLL_INTERVAL:-}
      # Auto-titler. TITLER_MODEL takes precedence; falls back to
      # LLM_MODEL when unset. At least one provider key must be present, or
      # the titler is left disabled and POST /conversations/{id}/regenerate-title
      # returns 503. Default: claude-haiku-4-5 (cheap-tier Anthropic).
      TITLER_MODEL: ${TITLER_MODEL:-anthropic/claude-haiku-4-5}
      # Default — Anthropic Sonnet 4.6. See orchestrator block above
      # for rationale; scripts/check-llm-defaults.sh asserts this fallback.
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4-6}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI-compatible endpoints (Yandex AI Studio DeepSeek Flash primary).
      SELF_HOSTED_0_URL: ${SELF_HOSTED_0_URL:-}
      SELF_HOSTED_0_MODEL: ${SELF_HOSTED_0_MODEL:-}
      SELF_HOSTED_0_API_KEY: ${SELF_HOSTED_0_API_KEY:-}
      LLM_FREE_TIER_DAILY_SPEND_USD: ${LLM_FREE_TIER_DAILY_SPEND_USD:-}
      LLM_CONVERSATION_INPUT_CAP: ${LLM_CONVERSATION_INPUT_CAP:-}
      LLM_CONVERSATION_OUTPUT_CAP: ${LLM_CONVERSATION_OUTPUT_CAP:-}
      LLM_RATELIMIT_ON_REDIS_DOWN: ${LLM_RATELIMIT_ON_REDIS_DOWN:-block}
      LLM_LOCAL_FALLBACK_REQUESTS_PER_HOUR: ${LLM_LOCAL_FALLBACK_REQUESTS_PER_HOUR:-}
      LLM_LOCAL_FALLBACK_WINDOW: ${LLM_LOCAL_FALLBACK_WINDOW:-}
      # Per-user SSE concurrency cap. Empty = defaults from code. See .env.example.
      SSE_MAX_PER_USER: ${SSE_MAX_PER_USER:-}
      # pgxpool tuning. Empty = defaults from code; setting any value
      # overrides. See .env.example for guidance and bounds.
      PG_MAX_CONNS: ${PG_MAX_CONNS:-}
      PG_MIN_CONNS: ${PG_MIN_CONNS:-}
      PG_MAX_CONN_LIFETIME: ${PG_MAX_CONN_LIFETIME:-}
      PG_MAX_CONN_IDLE_TIME: ${PG_MAX_CONN_IDLE_TIME:-}
      PG_HEALTH_CHECK_PERIOD: ${PG_HEALTH_CHECK_PERIOD:-}
      PG_MAX_CONN_LIFETIME_JITTER: ${PG_MAX_CONN_LIFETIME_JITTER:-}
      # Token envelope encryption (Phase 30). The api wraps each integration
      # row's DEK with Yandex Cloud KMS; both vars are REQUIRED by config load
      # — without them the api fails to boot ("TOKEN_ENCRYPTION_KMS_KEY_ID is
      # required"). See .env.example for how to provision them.
      TOKEN_ENCRYPTION_KMS_KEY_ID: ${TOKEN_ENCRYPTION_KMS_KEY_ID:?TOKEN_ENCRYPTION_KMS_KEY_ID must be set, see .env.example}
      YC_SA_JSON_CREDENTIALS: ${YC_SA_JSON_CREDENTIALS:?YC_SA_JSON_CREDENTIALS must be set (single-line SA key JSON), see .env.example}
      # Optional KMS rotation knobs — leave empty outside a key-rotation window.
      TOKEN_ENCRYPTION_KMS_DUAL_DECRYPT_VERSIONS: ${TOKEN_ENCRYPTION_KMS_DUAL_DECRYPT_VERSIONS:-}
      TOKEN_ENCRYPTION_KMS_VERSION_MAP: ${TOKEN_ENCRYPTION_KMS_VERSION_MAP:-}
      # Transactional email (Unisender Go) — the email_outbox worker drains
      # verification / password-reset / invitation mail through this provider.
      # When UNISENDER_API_KEY is empty the api falls back to NoopSender, which
      # ACCEPTS and then silently DROPS every message — so registration
      # confirmation mail never arrives. Set a real key + a sender on a verified
      # domain in .env for production. (Optional here so dev still boots.)
      UNISENDER_API_KEY: ${UNISENDER_API_KEY:-}
      UNISENDER_FROM_EMAIL: ${UNISENDER_FROM_EMAIL:-noreply@onevoice.app}
      UNISENDER_FROM_NAME: ${UNISENDER_FROM_NAME:-OneVoice}
      # mTLS — internal :8443 listener uses these to terminate TLS and
      # require a client cert signed by the dev CA. See infra/mtls/README.md.
      ONEVOICE_MTLS_ENABLED: "true"
      ONEVOICE_MTLS_CA_PATH: /etc/onevoice/mtls/ca.crt
      ONEVOICE_MTLS_CERT_PATH: /etc/onevoice/mtls/api.crt
      ONEVOICE_MTLS_KEY_PATH: /etc/onevoice/mtls/api.key
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      # mTLS material (dev). Operator runs `make mtls-certs` once before
      # `docker compose up` to populate infra/mtls/certs/. Production
      # replaces this mount with a secrets-manager-provisioned volume per
      # infra/mtls/README.md ("Dev vs Prod CA divergence").
      - ./infra/mtls/certs:/etc/onevoice/mtls:ro
      # Per-service NATS nkey seed (this service's identity only).
      - ./infra/nats/creds/api.nk:/etc/nats/creds/api.nk:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - onevoice-network
    restart: unless-stopped

  # Telegram agent
  agent-telegram:
    build:
      context: .
      dockerfile: Dockerfile.agent-telegram
    container_name: onevoice-agent-telegram
    environment:
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED: /etc/nats/creds/agent-telegram.nk
      NATS_CA_PATH: /etc/onevoice/mtls/ca.crt
      API_INTERNAL_URL: https://api:8443
      HEALTH_PORT: "8081"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}@redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Verifies the HMAC on inline approval callbacks. Must be identical to the
      # api's TELEGRAM_APPROVAL_HMAC_SECRET, or approvals are silently disabled.
      TELEGRAM_APPROVAL_HMAC_SECRET: ${TELEGRAM_APPROVAL_HMAC_SECRET:-}
      ONEVOICE_MTLS_ENABLED: "true"
      ONEVOICE_MTLS_CA_PATH: /etc/onevoice/mtls/ca.crt
      ONEVOICE_MTLS_CERT_PATH: /etc/onevoice/mtls/agent-telegram.crt
      ONEVOICE_MTLS_KEY_PATH: /etc/onevoice/mtls/agent-telegram.key
    volumes:
      - ./infra/mtls/certs:/etc/onevoice/mtls:ro
      # Per-service NATS nkey seed (this service's identity only).
      - ./infra/nats/creds/agent-telegram.nk:/etc/nats/creds/agent-telegram.nk:ro
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onevoice-network
    restart: unless-stopped

  # VK agent
  agent-vk:
    build:
      context: .
      dockerfile: Dockerfile.agent-vk
    container_name: onevoice-agent-vk
    environment:
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED: /etc/nats/creds/agent-vk.nk
      NATS_CA_PATH: /etc/onevoice/mtls/ca.crt
      API_INTERNAL_URL: https://api:8443
      HEALTH_PORT: "8082"
      VK_SERVICE_KEY: ${VK_SERVICE_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}@redis:6379/0
      ONEVOICE_MTLS_ENABLED: "true"
      ONEVOICE_MTLS_CA_PATH: /etc/onevoice/mtls/ca.crt
      ONEVOICE_MTLS_CERT_PATH: /etc/onevoice/mtls/agent-vk.crt
      ONEVOICE_MTLS_KEY_PATH: /etc/onevoice/mtls/agent-vk.key
    volumes:
      - ./infra/mtls/certs:/etc/onevoice/mtls:ro
      # Per-service NATS nkey seed (this service's identity only).
      - ./infra/nats/creds/agent-vk.nk:/etc/nats/creds/agent-vk.nk:ro
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onevoice-network
    restart: unless-stopped

  # Google Business agent
  agent-google-business:
    build:
      context: .
      dockerfile: Dockerfile.agent-google-business
    container_name: onevoice-agent-google-business
    environment:
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED: /etc/nats/creds/agent-google-business.nk
      NATS_CA_PATH: /etc/onevoice/mtls/ca.crt
      API_INTERNAL_URL: https://api:8443
      HEALTH_PORT: "8084"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}@redis:6379/0
      ONEVOICE_MTLS_ENABLED: "true"
      ONEVOICE_MTLS_CA_PATH: /etc/onevoice/mtls/ca.crt
      ONEVOICE_MTLS_CERT_PATH: /etc/onevoice/mtls/agent-google-business.crt
      ONEVOICE_MTLS_KEY_PATH: /etc/onevoice/mtls/agent-google-business.key
    volumes:
      - ./infra/mtls/certs:/etc/onevoice/mtls:ro
      # Per-service NATS nkey seed (this service's identity only).
      - ./infra/nats/creds/agent-google-business.nk:/etc/nats/creds/agent-google-business.nk:ro
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onevoice-network
    restart: unless-stopped

  # Yandex.Business RPA agent
  agent-yandex-business:
    build:
      context: .
      dockerfile: Dockerfile.agent-yandex-business
    container_name: onevoice-agent-yandex-business
    environment:
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED: /etc/nats/creds/agent-yandex-business.nk
      NATS_CA_PATH: /etc/onevoice/mtls/ca.crt
      API_INTERNAL_URL: https://api:8443
      HEALTH_PORT: "8083"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}@redis:6379/0
      # APP_ENV gates the boot-time PII warning when SCREENSHOT_MODE != off
      # (see cmd/main.go). Without propagation the production check was
      # silently dead in compose deploys.
      APP_ENV: ${APP_ENV:-development}
      # BrowserPool tuning (Phase 26 LRU eviction). Empty = defaults from code.
      BROWSER_POOL_MAX_CONTEXTS: ${BROWSER_POOL_MAX_CONTEXTS:-}
      # Screenshot capture mode for diagnostics. Default `off` — never
      # persist Yandex.Business DOM (PII) on host disk. Operators may
      # opt in to `tmpfs` (ephemeral, 1h TTL on /dev/shm) for staging
      # triage, or `full` for dev. See services/agent-yandex-business
      # /internal/yandex/browser.go for the enum.
      SCREENSHOT_MODE: ${SCREENSHOT_MODE:-off}
      # Shared representative org id; must match the api's value.
      YANDEX_SHARED_BUSINESS_ID: ${YANDEX_SHARED_BUSINESS_ID:-}
      # Fail-closed RPA scope gate. Off by default so a too-tight allowlist
      # cannot break the live RPA; set true once the allowlist is verified.
      SCOPE_GATE_ENFORCE: ${SCOPE_GATE_ENFORCE:-}
      # Required shared key that decrypts the sealed A2A tool args (connect
      # cookies) the api sends over NATS. Must be identical to the api's
      # A2A_PAYLOAD_KEY, or the connect flow cannot decrypt the cookies.
      A2A_PAYLOAD_KEY: ${A2A_PAYLOAD_KEY:?A2A_PAYLOAD_KEY must be set, EXACTLY 32 bytes (openssl rand -base64 24); identical on api + agent-yandex-business}
      ONEVOICE_MTLS_ENABLED: "true"
      ONEVOICE_MTLS_CA_PATH: /etc/onevoice/mtls/ca.crt
      ONEVOICE_MTLS_CERT_PATH: /etc/onevoice/mtls/agent-yandex-business.crt
      ONEVOICE_MTLS_KEY_PATH: /etc/onevoice/mtls/agent-yandex-business.key
    volumes:
      - ./infra/mtls/certs:/etc/onevoice/mtls:ro
      # Per-service NATS nkey seed (this service's identity only).
      - ./infra/nats/creds/agent-yandex-business.nk:/etc/nats/creds/agent-yandex-business.nk:ro
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onevoice-network
    restart: unless-stopped
    # Defence-in-depth for the headless-browser worker: it navigates
    # attacker-influenced content (review text, remote photos), so the
    # Chromium sandbox stays ON and the container shrinks the blast radius of
    # a renderer compromise on top of it.
    #
    # Chromium's namespace sandbox needs unprivileged user namespaces
    # (clone/unshare/setns with CLONE_NEWUSER), which Docker's default seccomp
    # profile blocks — that is the only reason --no-sandbox used to be needed.
    # infra/seccomp/chrome.json is the Docker default profile with exactly
    # those syscalls allowed, so the sandbox works with every capability
    # dropped and no-new-privileges set (validated locally against the
    # Playwright base image under user/read_only/tmpfs/cap_drop).
    #
    # Runs as the base image's non-root `pwuser` on a read-only root
    # filesystem; the only writable surfaces are the tmpfs mounts below
    # (Chromium user-data-dir under /tmp, shared memory on /dev/shm sized up
    # from the 64 MB default so the renderer does not OOM, and pwuser's HOME
    # for the browser profile/cache).
    #
    # NEEDS-LIVE-VALIDATION: run one real Yandex RPA tool after deploy to
    # confirm the browser launches sandboxed on the production kernel
    # (unprivileged user namespaces must be enabled on the host:
    # sysctl kernel.unprivileged_userns_clone=1 on kernels that gate it).
    user: pwuser
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /dev/shm:size=256m
      - /home/pwuser:size=64m
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./infra/seccomp/chrome.json"

  # LLM Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: onevoice-orchestrator
    environment:
      PORT: 8090
      NATS_URL: nats://nats:4222
      NATS_NKEY_SEED: /etc/nats/creds/orchestrator.nk
      NATS_CA_PATH: /etc/onevoice/mtls/ca.crt
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set (MongoDB auth); see .env.example}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set, generate with openssl rand -hex 24}@mongodb:27017/onevoice?authSource=admin
      MONGO_DB: onevoice
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set, generate with openssl rand -base64 24}@redis:6379/0
      # Internal API URL used by billingclient over mTLS.
      API_INTERNAL_URL: https://api:8443
      # Shared secret the internal inbound (chat/resume/draft-reply) requires.
      # MUST match the api's ORCHESTRATOR_INTERNAL_SECRET. Empty is refused at
      # boot when APP_ENV=production (see config.RequireInternalSecret).
      ORCHESTRATOR_INTERNAL_SECRET: ${ORCHESTRATOR_INTERNAL_SECRET:?ORCHESTRATOR_INTERNAL_SECRET must be set, generate with openssl rand -base64 32}
      APP_ENV: ${APP_ENV:-development}
      # Default — Anthropic Sonnet 4.6 for prompt-cache savings and Russian
      # quality. scripts/check-llm-defaults.sh asserts this fallback in CI;
      # do not revert without rotating the lint guard.
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-4-6}
      # Cheap-tier model for the review_sync drafter. Kept as its own env
      # var (rather than reusing TITLER_MODEL) so it can be tuned independently.
      DRAFT_REPLY_MODEL: ${DRAFT_REPLY_MODEL:-anthropic/claude-haiku-4-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # OpenAI-compatible endpoints (Yandex AI Studio DeepSeek Flash primary).
      SELF_HOSTED_0_URL: ${SELF_HOSTED_0_URL:-}
      SELF_HOSTED_0_MODEL: ${SELF_HOSTED_0_MODEL:-}
      SELF_HOSTED_0_API_KEY: ${SELF_HOSTED_0_API_KEY:-}
      LLM_FREE_TIER_DAILY_SPEND_USD: ${LLM_FREE_TIER_DAILY_SPEND_USD:-}
      LLM_CONVERSATION_INPUT_CAP: ${LLM_CONVERSATION_INPUT_CAP:-}
      LLM_CONVERSATION_OUTPUT_CAP: ${LLM_CONVERSATION_OUTPUT_CAP:-}
      LLM_RATELIMIT_ON_REDIS_DOWN: ${LLM_RATELIMIT_ON_REDIS_DOWN:-block}
      LLM_LOCAL_FALLBACK_REQUESTS_PER_HOUR: ${LLM_LOCAL_FALLBACK_REQUESTS_PER_HOUR:-}
      LLM_LOCAL_FALLBACK_WINDOW: ${LLM_LOCAL_FALLBACK_WINDOW:-}
      MAX_ITERATIONS: 10
      MAX_CONCURRENT_STREAMS: ${MAX_CONCURRENT_STREAMS:-}
      # Per-tool-call budget. Must stay below the NATS allow_responses expiry
      # emitted by tools/natskeygen, or a late agent reply is dropped by the bus.
      TOOL_EXEC_TIMEOUT: ${TOOL_EXEC_TIMEOUT:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-}
      HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-}
      LLM_TIER: ${LLM_TIER:-}
      # Lifts the production cross-border LLM gate; only with a filed legal basis.
      ALLOW_TRANSBORDER_LLM: ${ALLOW_TRANSBORDER_LLM:-}
      # Registers the dark, unverified Google Business tools. Off by default.
      ENABLE_GOOGLE_BUSINESS: ${ENABLE_GOOGLE_BUSINESS:-}
      ONEVOICE_MTLS_ENABLED: "true"
      ONEVOICE_MTLS_CA_PATH: /etc/onevoice/mtls/ca.crt
      ONEVOICE_MTLS_CERT_PATH: /etc/onevoice/mtls/orchestrator.crt
      ONEVOICE_MTLS_KEY_PATH: /etc/onevoice/mtls/orchestrator.key
      # Generated-media object store (MinIO/S3). Mirrors the api service's keys
      # so one bucket serves both; only consulted when image generation is on.
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-onevoice}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      # Absolute public origin generated photo_url values are rooted at; MUST be
      # set together with S3_* above for the generate_image tool to register.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Image generation (generate_image tool). OFF unless IMAGE_GEN_ENABLED=true
      # AND the selected provider's credential is supplied: provider "yandexart"
      # uses YANDEX_ART_API_KEY + YANDEX_ART_FOLDER_ID; "openai" uses OPENAI_API_KEY.
      IMAGE_GEN_ENABLED: ${IMAGE_GEN_ENABLED:-}
      IMAGE_GEN_PROVIDER: ${IMAGE_GEN_PROVIDER:-openai}
      IMAGE_GEN_MODEL: ${IMAGE_GEN_MODEL:-}
      IMAGE_GEN_SIZE: ${IMAGE_GEN_SIZE:-}
      IMAGE_GEN_MAX_BYTES: ${IMAGE_GEN_MAX_BYTES:-}
      IMAGE_GEN_MAX_PER_TURN: ${IMAGE_GEN_MAX_PER_TURN:-}
      IMAGE_GEN_BUCKET_TIMEOUT: ${IMAGE_GEN_BUCKET_TIMEOUT:-}
      YANDEX_ART_API_KEY: ${YANDEX_ART_API_KEY:-}
      YANDEX_ART_FOLDER_ID: ${YANDEX_ART_FOLDER_ID:-}
    # Not published beyond loopback: the api reaches it on orchestrator:8090
    # inside onevoice-network; the 127.0.0.1 host mapping keeps it dialable for
    # host-run dev without exposing the unauthenticated-by-default (dev) inbound
    # on the VM's public IP. docker-compose.prod.yml drops even the loopback
    # mapping via `ports: !reset []`.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./infra/mtls/certs:/etc/onevoice/mtls:ro
      # Per-service NATS nkey seed (this service's identity only).
      - ./infra/nats/creds/orchestrator.nk:/etc/nats/creds/orchestrator.nk:ro
    depends_on:
      nats:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - onevoice-network
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://api:8080
        ORCHESTRATOR_URL: http://orchestrator:8090
        # 152-ФЗ Art. 14 data-controller identity, inlined at build time.
        # APP_ENV=production makes the build hard-fail on placeholder values
        # (see services/frontend/scripts/check-legal-entity.mjs); defaults to
        # development so local builds skip the gate.
        APP_ENV: ${APP_ENV:-development}
        NEXT_PUBLIC_LEGAL_ENTITY_NAME: ${NEXT_PUBLIC_LEGAL_ENTITY_NAME:-}
        NEXT_PUBLIC_LEGAL_INN: ${NEXT_PUBLIC_LEGAL_INN:-}
        NEXT_PUBLIC_LEGAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_ADDRESS:-}
        NEXT_PUBLIC_LEGAL_EMAIL_PDN: ${NEXT_PUBLIC_LEGAL_EMAIL_PDN:-}
    container_name: onevoice-frontend
    environment:
      - NODE_ENV=production
      - LANDING_ENTRY_MODE=${LANDING_ENTRY_MODE:-hybrid}
    depends_on:
      - api
    networks:
      - onevoice-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: onevoice-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - onevoice-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  minio_data:
    driver: local

networks:
  onevoice-network:
    driver: bridge
