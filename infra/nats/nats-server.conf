# NATS server configuration for OneVoice.
#
# Authentication is mandatory. The single account's credentials come from the
# environment (NATS_USER / NATS_PASSWORD) so no password is baked into the image
# or committed here. NATS expands $VAR references from the process environment at
# load time. Grow this into per-service accounts or nkey/JWT auth as the cluster
# scales; every client resolves credentials through pkg/natsauth (NATS_USER /
# NATS_PASSWORD or a NATS_CREDS file).
#
# TLS is left disabled so `docker compose up` boots without certificate material.
# To enable it: provision a server cert/key + CA (see infra/mtls/README.md),
# mount them under /etc/nats/certs, uncomment the tls block below, and set
# NATS_CA_PATH (plus NATS_CLIENT_CERT / NATS_CLIENT_KEY for mutual TLS) on every
# client service so pkg/natsauth wraps the dial in TLS.

jetstream {
  store_dir: "/data"
}

# Monitoring endpoint (used by the container healthcheck). Not published to the
# host; reachable only inside onevoice-network. Requires no client auth.
http_port: 8222

authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}

