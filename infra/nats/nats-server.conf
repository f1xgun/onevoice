# NATS server configuration for OneVoice.
#
# Authentication is mandatory and per-service. Each service presents its own
# nkey user seed (ed25519); the server maps the derived public key to a
# subject-scoped publish/subscribe allow-list. The seed signs the server's nonce
# and never crosses the wire — there is no shared password. The user table lives
# in creds/auth.conf, generated by `make nats-creds` (tools/natskeygen) from the
# verified per-service pub/sub map: only public keys land in that file; the
# secret seeds sit beside it as <service>.nk and are gitignored. Run
# `make nats-creds` once before `docker compose up`, exactly like `make
# mtls-certs`.
#
# TLS is mandatory too: the server presents nats.crt (SAN DNS:nats) and every
# client verifies it against the shared dev CA via NATS_CA_PATH. Client identity
# is the nkey, so no client certificate is required (verify stays off). The cert
# material is the same dev CA bundle the HTTP mTLS plane uses
# (infra/mtls/certs, produced by `make mtls-certs`).

jetstream {
  store_dir: "/data"
}

# Monitoring endpoint (used by the container healthcheck). Not published to the
# host; reachable only inside onevoice-network. Requires no client auth and is
# not TLS-wrapped (separate from the client port).
http_port: 8222

# Per-service nkey users + subject permissions (generated; see header).
include "creds/auth.conf"

tls {
  cert_file: "/etc/nats/certs/nats.crt"
  key_file:  "/etc/nats/certs/nats.key"
  # verify is off: clients authenticate with nkeys, not client certs. TLS here
  # provides transport encryption and lets clients verify the server identity.
  verify: false
}
