name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # Detect which subtree(s) changed so backend-only PRs don't spend CI minutes
  # on frontend tooling and vice versa. Cross-cutting paths (this workflow
  # file, Makefile, root linter config, go.work) trigger BOTH sides — touching
  # them is a cross-cutting change.
  #
  # Required-check note: when a downstream job is skipped via `if:` against
  # these outputs, GitHub treats the skipped status as PASSING for branch
  # protection — gating jobs this way does not break required-check rules.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend-docker: ${{ steps.filter.outputs.backend-docker }}
      frontend-docker: ${{ steps.filter.outputs.frontend-docker }}
      observability: ${{ steps.filter.outputs.observability }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'pkg/**'
              - 'services/api/**'
              - 'services/orchestrator/**'
              - 'services/agent-telegram/**'
              - 'services/agent-vk/**'
              - 'services/agent-yandex-business/**'
              - 'services/agent-google-business/**'
              - 'tools/**'
              - 'go.work'
              - 'go.work.sum'
              - '.golangci.yml'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            frontend:
              - 'services/frontend/**'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            backend-docker:
              - 'pkg/**'
              - 'services/api/**'
              - 'services/orchestrator/**'
              - 'services/agent-telegram/**'
              - 'services/agent-vk/**'
              - 'services/agent-yandex-business/**'
              - 'services/agent-google-business/**'
              - 'go.work'
              - 'go.work.sum'
              - 'Dockerfile'
              - 'Dockerfile.orchestrator'
              - 'Dockerfile.agent-telegram'
              - 'Dockerfile.agent-vk'
              - 'Dockerfile.agent-yandex-business'
              - '.github/workflows/ci.yml'
            frontend-docker:
              - 'services/frontend/**'
              - '.github/workflows/ci.yml'
            observability:
              - 'observability/**'
              - '.github/workflows/ci.yml'

  go-lint:
    name: Go Lint & Security
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            pkg/go.sum
            pkg/audit/go.sum
            services/api/go.sum
            services/orchestrator/go.sum
            services/agent-telegram/go.sum
            services/agent-vk/go.sum
            services/agent-yandex-business/go.sum
            services/agent-google-business/go.sum

      - name: Lint pkg
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: pkg
        env:
          GOWORK: "off"

      - name: Lint api
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: services/api
        env:
          GOWORK: "off"

      - name: Lint orchestrator
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: services/orchestrator
        env:
          GOWORK: "off"

      - name: Lint agent-telegram
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: services/agent-telegram
        env:
          GOWORK: "off"

      - name: Lint agent-vk
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: services/agent-vk
        env:
          GOWORK: "off"

      - name: Lint agent-yandex-business
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: services/agent-yandex-business
        env:
          GOWORK: "off"

      # Nested Go modules (own go.mod). `go ... ./...` stops at module
      # boundaries, so the per-module steps above never descend into these —
      # they would rot unlinted otherwise (a pkg/audit test-arity break once
      # reached main behind green CI for exactly this reason).
      - name: Lint pkg-audit
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: pkg/audit
        env:
          GOWORK: "off"

      - name: Lint pkg-email
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: pkg/email
        env:
          GOWORK: "off"

      - name: Lint agent-google-business
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11
          args: --config ${{ github.workspace }}/.golangci.yml
          working-directory: services/agent-google-business
        env:
          GOWORK: "off"

      - name: No-inline-URL check (custom analyzer)
        run: make lint-urls

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Govulncheck pkg
        run: govulncheck ./...
        continue-on-error: true
        working-directory: pkg
        env:
          GOWORK: "off"

      - name: Govulncheck api
        run: govulncheck ./...
        continue-on-error: true
        working-directory: services/api
        env:
          GOWORK: "off"

      - name: Govulncheck orchestrator
        run: govulncheck ./...
        continue-on-error: true
        working-directory: services/orchestrator
        env:
          GOWORK: "off"

      # Enforce the RBAC chokepoint via the custom analyzer at tools/lint-rbac.
      # Without this step, a new business-scoped route that bypasses
      # authz.RequireBusinessAccess / Can / BusinessContextFromCtx would land
      # in main with green CI — entire chokepoint would depend on dev discipline.
      - name: RBAC drift check
        run: make lint-rbac

      # Catch divergence between docs/api/spec/openapi.yaml (the spec
      # source-of-truth; modular split across spec/paths/*.yaml + inline
      # components) and services/api/internal/openapi/types.gen.go. A PR
      # that edits the spec without committing the regenerated types — or
      # vice versa — fails here.
      - name: OpenAPI types drift check
        run: |
          make oapi-install
          make oapi-check

  go-test:
    name: Go Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            pkg/go.sum
            pkg/audit/go.sum
            services/api/go.sum
            services/orchestrator/go.sum
            services/agent-telegram/go.sum
            services/agent-vk/go.sum
            services/agent-yandex-business/go.sum
            services/agent-google-business/go.sum

      # mTLS cert harness — generate ephemeral dev CA + per-service leaf
      # certs into infra/mtls/certs/ so the API + tokenclient mTLS tests
      # have material to load. The script is idempotent + check-certs
      # verifies the chain before tests run. Cert material lives only in
      # the runner FS and is gitignored — never persists across runs.
      - name: Generate ephemeral mTLS certs
        run: bash scripts/gen-mtls-certs.sh

      - name: Verify mTLS cert chain
        run: bash scripts/check-mtls-certs.sh

      - name: Test pkg
        run: go test -v -race -coverprofile=coverage-pkg.out ./...
        working-directory: pkg
        env:
          GOWORK: "off"

      - name: Test api
        run: go test -v -race -coverprofile=coverage-api.out ./...
        working-directory: services/api
        env:
          GOWORK: "off"

      # The //go:build integration tests need live datastores, so they are NOT
      # run here — but the default `go test` above never compiles them either,
      # which let signature drift (a moved constructor, a router.Setup arity
      # change) rot the suite until `make integration-tests` was run. Type-check
      # them with `go vet -tags integration` so the build can't break unseen.
      - name: Vet api integration build
        run: go vet -tags integration ./...
        working-directory: services/api
        env:
          GOWORK: "off"

      - name: Test orchestrator
        run: go test -v -race -coverprofile=coverage-orchestrator.out ./...
        working-directory: services/orchestrator
        env:
          GOWORK: "off"

      - name: Test agent-telegram
        run: go test -v -race -coverprofile=coverage-agent-telegram.out ./...
        working-directory: services/agent-telegram
        env:
          GOWORK: "off"

      - name: Test agent-vk
        run: go test -v -race -coverprofile=coverage-agent-vk.out ./...
        working-directory: services/agent-vk
        env:
          GOWORK: "off"

      - name: Test agent-yandex-business
        run: go test -v -race -coverprofile=coverage-agent-yandex-business.out ./...
        working-directory: services/agent-yandex-business
        env:
          GOWORK: "off"

      # Nested Go modules (own go.mod) — see the lint job for why these need
      # explicit steps. `go test ./...` in pkg/ or services/ never reaches them.
      - name: Test pkg-audit
        run: go test -v -race -coverprofile=coverage-pkg-audit.out ./...
        working-directory: pkg/audit
        env:
          GOWORK: "off"

      - name: Test pkg-email
        run: go test -v -race -coverprofile=coverage-pkg-email.out ./...
        working-directory: pkg/email
        env:
          GOWORK: "off"

      - name: Test agent-google-business
        run: go test -v -race -coverprofile=coverage-agent-google-business.out ./...
        working-directory: services/agent-google-business
        env:
          GOWORK: "off"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            pkg/coverage-pkg.out
            pkg/audit/coverage-pkg-audit.out
            pkg/email/coverage-pkg-email.out
            services/api/coverage-api.out
            services/orchestrator/coverage-orchestrator.out
            services/agent-telegram/coverage-agent-telegram.out
            services/agent-vk/coverage-agent-vk.out
            services/agent-yandex-business/coverage-agent-yandex-business.out
            services/agent-google-business/coverage-agent-google-business.out

  frontend:
    name: Frontend Build & Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: services/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

  # Split the original `docker-build` matrix into two jobs so each side can
  # be gated independently. The matrix `name:` strings are preserved
  # ("Docker Build (api)" .. "Docker Build (frontend)") so any existing
  # branch protection rule pinned to a specific check name keeps matching.
  docker-build-go:
    name: Docker Build (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.backend-docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: Dockerfile
          - image: orchestrator
            context: .
            file: Dockerfile.orchestrator
          - image: agent-telegram
            context: .
            file: Dockerfile.agent-telegram
          - image: agent-vk
            context: .
            file: Dockerfile.agent-vk
          - image: agent-yandex-business
            context: .
            file: Dockerfile.agent-yandex-business
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  docker-build-frontend:
    name: Docker Build (frontend)
    needs: changes
    if: needs.changes.outputs.frontend-docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  observability:
    name: Observability Config Validation
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: promtool check rules
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/observability:/o" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.52.0 \
            check rules /o/prometheus/alerts/http.yml \
                       /o/prometheus/alerts/llm.yml \
                       /o/prometheus/alerts/nats.yml \
                       /o/prometheus/alerts/rpa.yml \
                       /o/prometheus/alerts/dbpool.yml \
                       /o/prometheus/alerts/fleet.yml \
                       /o/prometheus/alerts/backup.yml \
                       /o/prometheus/alerts/email.yml \
                       /o/prometheus/alerts/sweepers.yml

      - name: promtool check config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/observability/prometheus:/etc/prometheus" \
            -v "${{ github.workspace }}/observability/prometheus/alerts:/etc/prometheus/alerts:ro" \
            --entrypoint /bin/promtool \
            prom/prometheus:v2.52.0 \
            check config /etc/prometheus/prometheus.yml

      - name: amtool check-config
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/observability:/o" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.31.0 \
            check-config /o/alertmanager/alertmanager.yml

  pr-meta:
    name: PR Labels & Size Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml

      - name: PR size check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const totalChanges = additions + deletions;

            if (totalChanges > 500) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['size/large'],
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `**Warning:** This PR has ${totalChanges} changed lines (${additions}+ / ${deletions}-). Consider breaking it into smaller PRs for easier review.`,
              });
            }
