name: backup-restore-drill

# Weekly CI restore drill (D-04). Runs scripts/backup/restore.sh against a
# SEPARATE drill bucket (see docs/runbook-restore.md §6 for secret setup).
# Catches `restic check` failures, decryption breaks, and snapshot-format
# drift before they surface on a real outage.

on:
  schedule:
    - cron: '0 4 * * 0'  # Sunday 04:00 UTC
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Install client tools (restic, postgres-client, mongosh, mongo-tools, yc)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client restic curl gnupg
          # MongoDB Shell + Database Tools from official MongoDB apt repo.
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc \
            | sudo gpg -o /usr/share/keyrings/mongodb.gpg --dearmor
          echo "deb [signed-by=/usr/share/keyrings/mongodb.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" \
            | sudo tee /etc/apt/sources.list.d/mongo.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh mongodb-database-tools
          # Yandex Cloud CLI (pinned to the same version as the backup container).
          curl -fsSL "https://storage.yandexcloud.net/yandexcloud-yc/release/0.130.0/linux/amd64/yc" \
            | sudo tee /usr/local/bin/yc > /dev/null
          sudo chmod 0755 /usr/local/bin/yc

      - name: Run restore drill
        env:
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY_DRILL }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD_DRILL_PLAINTEXT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_DRILL }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY_DRILL }}
          AWS_DEFAULT_REGION: ru-central1
          SCRATCH_PG_DSN: postgres://postgres:drill@localhost:5432/scratch?sslmode=disable
          SCRATCH_MONGO_URI: mongodb://localhost:27017
        run: bash scripts/backup/restore.sh
