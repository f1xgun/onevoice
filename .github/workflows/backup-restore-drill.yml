name: backup-restore-drill

# Weekly CI restore drill. Runs scripts/backup/restore.sh against a
# SEPARATE drill bucket (see docs/runbook-restore.md §6 for secret setup).
# Catches `restic check` failures, decryption breaks, and snapshot-format
# drift before they surface on a real outage.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup-restore-drill.yml'
  schedule:
    - cron: '0 4 * * 0'  # Sunday 04:00 UTC
  workflow_dispatch:

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Require drill secrets
        env:
          RESTIC_REPOSITORY_DRILL: ${{ secrets.RESTIC_REPOSITORY_DRILL }}
          RESTIC_PASSWORD_DRILL_PLAINTEXT: ${{ secrets.RESTIC_PASSWORD_DRILL_PLAINTEXT }}
          YC_S3_ACCESS_KEY_DRILL: ${{ secrets.YC_S3_ACCESS_KEY_DRILL }}
          YC_S3_SECRET_KEY_DRILL: ${{ secrets.YC_S3_SECRET_KEY_DRILL }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            RESTIC_REPOSITORY_DRILL \
            RESTIC_PASSWORD_DRILL_PLAINTEXT \
            YC_S3_ACCESS_KEY_DRILL \
            YC_S3_SECRET_KEY_DRILL
          do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Build the operator backup image
        run: docker build --tag onevoice-backup:restore-drill scripts/backup

      - name: Run restore drill
        env:
          RESTIC_REPOSITORY: ${{ secrets.RESTIC_REPOSITORY_DRILL }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD_DRILL_PLAINTEXT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_DRILL }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY_DRILL }}
          AWS_DEFAULT_REGION: ru-central1
          SCRATCH_PG_DSN: postgres://postgres:drill@localhost:5432/scratch?sslmode=disable
          SCRATCH_MONGO_URI: mongodb://localhost:27017
        run: |
          docker run --rm --network host \
            --env RESTIC_REPOSITORY \
            --env RESTIC_PASSWORD \
            --env AWS_ACCESS_KEY_ID \
            --env AWS_SECRET_ACCESS_KEY \
            --env AWS_DEFAULT_REGION \
            --env SCRATCH_PG_DSN \
            --env SCRATCH_MONGO_URI \
            --entrypoint bash \
            onevoice-backup:restore-drill \
            /scripts/backup/restore.sh

  entrypoint-roundtrip:
    # regression-guards the entrypoint.sh decode
    # pipeline. The production path uses Yandex KMS (no GitHub Actions
    # access in PR runs), but the shape under test is the shell-level
    # capture pattern that broke in the original implementation:
    # piping a `--plaintext-file /dev/stdout` invocation through a
    # base64 decoder corrupted raw plaintext bytes by re-decoding them
    # as base64. openssl AES-256-CBC is the KMS stand-in here because
    # the round-trip arithmetic (capture command-substitution output,
    # assert byte equality vs original) is identical.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check (entrypoint.sh)
        run: bash -n scripts/backup/entrypoint.sh

      - name: Assert pinned YC CLI ciphertext contract
        run: |
          set -euo pipefail
          if grep -n -- '--ciphertext-base64' scripts/backup/entrypoint.sh; then
            echo "::error file=scripts/backup/entrypoint.sh::yc 0.130.0 does not support --ciphertext-base64." >&2
            exit 1
          fi
          grep -q -- '--ciphertext-file' scripts/backup/entrypoint.sh

      - name: Entrypoint ciphertext and plaintext round-trip
        run: |
          set -euo pipefail
          fake_bin="$(mktemp -d)"
          trap 'rm -rf "$fake_bin"' EXIT
          cat > "$fake_bin/yc" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "$1 $2" = "config set" ]; then exit 0; fi
          shift 3
          ciphertext_file=""
          plaintext_file=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --id) shift 2 ;;
              --ciphertext-file) ciphertext_file="$2"; shift 2 ;;
              --plaintext-file) plaintext_file="$2"; shift 2 ;;
              *) echo "unsupported fake-yc argument: $1" >&2; exit 2 ;;
            esac
          done
          test -s "$ciphertext_file"
          cat "$ciphertext_file" > "$plaintext_file"
          SH
          chmod +x "$fake_bin/yc"

          original="$(openssl rand -base64 32 | tr -d '\n')"
          ciphertext_b64="$(printf '%s' "$original" | base64 -w0)"
          sudo env PATH="$fake_bin:$PATH" \
          EXPECTED_RESTIC_PASSWORD="$original" \
          YC_SA_JSON_CREDENTIALS='{}' \
          RESTIC_PASSWORD_KMS_KEY_ID=test-key \
          RESTIC_PASSWORD_CIPHERTEXT="$ciphertext_b64" \
          RESTIC_REPOSITORY=test-repository \
          PG_DSN=test-pg \
          MONGO_URI=test-mongo \
          PUSHGATEWAY_URL=test-pushgateway \
          scripts/backup/entrypoint.sh bash -lc \
            '. /etc/profile.d/restic.sh; test "$RESTIC_PASSWORD" = "$EXPECTED_RESTIC_PASSWORD"; rm -f /etc/profile.d/restic.sh /root/.config/yandex-cloud/credentials.json'
