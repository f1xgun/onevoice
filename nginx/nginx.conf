events { worker_connections 1024; }

http {
  server_tokens off;
  proxy_hide_header X-Powered-By;
  proxy_hide_header Strict-Transport-Security;
  proxy_hide_header Content-Security-Policy;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Cross-Origin-Opener-Policy;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://smartcaptcha.yandexcloud.net https://smartcaptcha.cloud.yandex.ru 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' ${CSP_API_ORIGIN} https://smartcaptcha.yandexcloud.net https://smartcaptcha.cloud.yandex.ru ws: wss:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://smartcaptcha.yandexcloud.net https://smartcaptcha.cloud.yandex.ru; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Docker DNS resolver — re-resolves on container restart
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    client_max_body_size 10m;

    # API routes — direct to API service (bypass Next.js)
    location = /nginx-health {
      access_log off;
      return 200;
    }

    location /api/v1/ {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # SSE support for chat endpoint
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # User uploads — direct to MinIO object storage (public-read bucket).
    # `rewrite … break` strips the /media/ prefix and prepends the bucket
    # name; proxy_pass then uses ONLY the variable (no URI part), so nginx
    # forwards the rewritten URI verbatim. Mixing a variable with a URI in
    # proxy_pass (e.g. `$upstream/onevoice/`) makes nginx ignore the
    # request path and always proxy to the bucket root, which returned a
    # ListBucketResult instead of the object.
    # The bare prefix is never an object — refuse it here so it can never be
    # forwarded as a bucket-root request (which S3 answers with a listing).
    location = /media/ {
      return 404;
    }

    location /media/ {
      set $minio_upstream http://minio:9000;
      rewrite ^/media/(.+)$ /onevoice/$1 break;
      proxy_pass $minio_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Health — direct to API. /metrics is intentionally NOT proxied: it is
    # scraped over the internal docker network, never the public edge.
    location ^~ /health/ {
      return 404;
    }

    location = /health/live {
      set $api_upstream http://api:8080;
      proxy_pass $api_upstream;
    }

    # Everything else — frontend
    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_pass $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
