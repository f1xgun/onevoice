version: "2"

# NOTE: lint-rbac runs as a standalone CLI via `make lint-rbac` (tools/lint-rbac/).
# A custom golangci-lint plugin entry (linters-settings.custom.rbac) is reserved
# for v2.1 once Go's plugin loading stabilises across macOS arm64.

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/f1xgun/onevoice

linters:
  enable:
    # Core
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

    # Style
    - revive
    - misspell
    - unconvert
    - whitespace

    # Quality
    - gocritic
    - goconst
    - mnd
    - nolintlint
    - prealloc
    - unparam

    # Security
    - bodyclose
    - gosec

    # Correctness
    - exhaustive
    - copyloopvar

  settings:
    revive:
      rules:
        - name: context-keys-type
        - name: error-naming
        - name: unexported-return
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - opinionated

    exhaustive:
      default-signifies-exhaustive: true

    nolintlint:
      require-explanation: true
      require-specific: true

    goconst:
      min-len: 4
      min-occurrences: 3

    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "3"
        - "10"
        - "100"
        - "1000"
      ignored-functions:
        - "strconv.*"
        - "strings.SplitN"
        - "make"
        - "context.WithTimeout"
        - "time.Date"

    gosec:
      excludes:
        - G104
        - G117
        - G118
        - G704
        - G706

    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam
          - bodyclose
          - goconst
          - mnd
    paths:
      - vendor
      - node_modules
      - ".*_gen\\.go$"
      - ".*\\.pb\\.go$"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
