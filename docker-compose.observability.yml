# ============================================================
# OneVoice observability stack — TAILNET-ONLY
# ============================================================
# No service in this file binds to a host port. Operators reach
# Grafana / Prometheus / Loki via Tailscale to the host (see
# docs/runbook-observability-access.md).
#
# NEVER add a `ports:` mapping here. If you need temporary local
# access during development, use `docker compose exec` or
# `docker compose port` ad-hoc — do not commit `ports:`.
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks:
      - onevoice-network
    restart: unless-stopped

  # Loki — log aggregation
  loki:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    image: grafana/loki:3.0.0
    container_name: onevoice-loki
    command: -config.file=/etc/loki/loki-config.yml -target=all
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network
    restart: unless-stopped

  # Promtail — log collector (ships Docker logs to Loki)
  promtail:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
    image: grafana/promtail:3.0.0
    container_name: onevoice-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - onevoice-network
    restart: unless-stopped

  # Prometheus — metrics collection
  prometheus:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    image: prom/prometheus:v2.52.0
    container_name: onevoice-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network
    restart: unless-stopped

  # Grafana — dashboards and visualization
  grafana:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    image: grafana/grafana:11.0.0
    container_name: onevoice-grafana
    environment:
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required — see .env.example and docs/runbook-launch-readiness.md}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onevoice-network
    restart: unless-stopped

  # Alertmanager — operator alerting (tailnet-only, no `ports:` block).
  # bot_token / chat_id are written by the entrypoint script from
  # env vars into files at /etc/alertmanager/secrets/, then referenced
  # via bot_token_file / chat_id_file in alertmanager.yml so the
  # secrets never appear inline in any YAML literal.
  alertmanager:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    image: prom/alertmanager:v0.31.0
    container_name: onevoice-alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - >
        mkdir -p /etc/alertmanager/secrets &&
        printf '%s' "$$AM_TELEGRAM_BOT_TOKEN" > /etc/alertmanager/secrets/bot_token &&
        printf '%s' "$$AM_TELEGRAM_CHAT_ID" > /etc/alertmanager/secrets/chat_id &&
        chmod 600 /etc/alertmanager/secrets/* &&
        exec /bin/alertmanager
        --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager
    environment:
      AM_TELEGRAM_BOT_TOKEN: "${AM_TELEGRAM_BOT_TOKEN:?AM_TELEGRAM_BOT_TOKEN required — see .env.example and docs/runbook/observability.md}"
      AM_TELEGRAM_CHAT_ID: "${AM_TELEGRAM_CHAT_ID:?AM_TELEGRAM_CHAT_ID required — see .env.example and docs/runbook/observability.md}"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - onevoice-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Pushgateway — receives short-lived job metrics (backup, etc.).
  # No host port — Prometheus scrapes it on the internal network.
  pushgateway:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
    image: prom/pushgateway:v1.9.0
    container_name: onevoice-pushgateway
    networks:
      - onevoice-network
    restart: unless-stopped

  # Backup — daily pg_dump + mongodump → restic → Yandex Object Storage.
  # RESTIC_PASSWORD is decrypted from Yandex KMS at container boot
  # (entrypoint.sh); never stored on host in plaintext.
  # BusyBox crond drives the 00:00 UTC schedule.
  backup:
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    build:
      context: ./scripts/backup
      args:
        YC_VERSION: "0.130.0"
    container_name: onevoice-backup
    environment:
      PG_DSN: "${BACKUP_PG_DSN}"
      MONGO_URI: "${BACKUP_MONGO_URI}"
      RESTIC_REPOSITORY: "${RESTIC_REPOSITORY:?RESTIC_REPOSITORY required}"
      RESTIC_PASSWORD_CIPHERTEXT: "${RESTIC_PASSWORD_CIPHERTEXT:?KMS-encrypted RESTIC_PASSWORD required}"
      RESTIC_PASSWORD_KMS_KEY_ID: "${RESTIC_PASSWORD_KMS_KEY_ID:?KMS key id required}"
      YC_SA_JSON_CREDENTIALS: "${YC_SA_JSON_CREDENTIALS:?Yandex Cloud service-account JSON required}"
      YC_BACKUP_BUCKET: "${YC_BACKUP_BUCKET:-onevoice-backups}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ru-central1}"
      PUSHGATEWAY_URL: "${PUSHGATEWAY_URL:-http://pushgateway:9091}"
    restart: unless-stopped
    networks:
      - onevoice-network
    depends_on:
      pushgateway:
        condition: service_started

volumes:
  loki_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

networks:
  onevoice-network:
    driver: bridge
